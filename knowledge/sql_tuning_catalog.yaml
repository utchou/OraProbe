catalog_version: 2.0
product: OraProbe
scope: SQL Query Tuning Knowledge Specification
oracle_target: 19c
implementation_status: knowledge-only
catalog_status: v2-specification

taxonomy:
  domains:
    - code: AP
      name: Access Path
    - code: CARD
      name: Cardinality and Statistics
    - code: JOIN
      name: Join and Set Operations
    - code: SORT
      name: Sort and Aggregation
    - code: SUBQ
      name: Subquery and Query Transformation
    - code: CUR
      name: Cursor and Plan Stability
    - code: PAR
      name: Parallelism and Resource Profile
    - code: PART
      name: Partitioning and Segment Scope
    - code: IDX
      name: Index and Object Design
    - code: PRED
      name: Predicate and Bind Behavior
    - code: DATA
      name: Data and Workload Shape
    - code: EXT
      name: External Contributors

rules:
  - id: AP-001
    name: Full scan not justified by row set or predicate
    domain: AP
    classification: [root-cause-candidate, symptom]
    problem_description: A full scan is chosen even though the predicate and object shape suggest a smaller, more selective read pattern.
    why_it_matters: Large scans can multiply logical reads, physical I/O, and CPU cost.
    required_evidence:
      - SQL text
      - execution plan
      - table row count
      - predicate values
      - estimated vs actual rows
    oracle_sources:
      - {source: V$SQL_PLAN, license: base}
      - {source: DBA_TABLES, license: base}
      - {source: DBMS_XPLAN, license: base}
    detection_conditions:
      - full-table-scan operation is present on an object that is not obviously bulk-read by design
      - predicate appears selective or highly selective
      - actual rows are much lower than scan volume suggests
    counter_evidence:
      - object is intentionally read in bulk
      - row source is a small table or a partitioned table with a valid broad-range read
      - parallel full scan is clearly the cheapest approach by runtime evidence
    false_positive_risks:
      - scanning a large object can be legitimate when business logic requires most rows
      - large partition scans can be correct under broad range predicates
    confidence_logic:
      - low when evidence is sparse
      - medium when plan and row counts suggest an inefficient access pattern
      - high only when the SQL repeatedly dominates runtime and a better access path is supported by evidence
    root_cause_statement: "The plan is using a full scan instead of a more selective access path, causing unnecessary row reads and higher runtime cost."
    recommendation: "Validate whether the predicate is truly selective; test a more aligned index or partition strategy; confirm the scan is not intentionally reading most of the object."
    validation: "Compare plan before and after any change; check actual rows read and runtime improvement; validate against comparable workloads."
    safety_risk: moderate
    related_rules: [AP-002, AP-003, PRED-004, CARD-005]
    reinforcing_rules: [CARD-001, CARD-005, PRED-003]
    contradictory_rules: [DATA-003]
    dependency_relationships: ["predicate structure can force this access path"]
    evidence_availability_behavior: "If row counts or plan evidence are unavailable, mark as insufficient evidence rather than negative diagnosis."
    oracle_version_notes: "Oracle 19c plan behavior remains consistent with general access-path guidance; newer versions may change optimizer costing, but the logic remains similar."
    licensing_notes: "No special licensing required for the base plan and table metadata evidence."
    source_reference: "Oracle Database 19c SQL Tuning Guide; Oracle Database Reference for V$SQL_PLAN and DBA_TABLES; Oracle optimizer documentation on access-path costing."

  - id: AP-002
    name: Missing selective access path
    domain: AP
    classification: [root-cause-candidate]
    problem_description: The SQL filters on a selective condition but Oracle chooses an access method that reads too much data.
    why_it_matters: A selective predicate should usually allow a more direct path to a smaller row set.
    required_evidence:
      - predicate columns
      - index metadata
      - plan steps
      - object row count
    oracle_sources:
      - {source: DBA_INDEXES, license: base}
      - {source: DBA_IND_COLUMNS, license: base}
      - {source: V$SQL_PLAN, license: base}
    detection_conditions:
      - selective predicate present
      - indexed or candidate access path exists but is not used
      - row count and runtime cost indicate poor path selection
    counter_evidence:
      - the predicate is not selective in practice
      - object is small or benefits from full scan
    false_positive_risks:
      - a selective predicate may still be cheap under a full scan
    confidence_logic:
      - medium when a valid alternative path exists
      - high when the full scan repeatedly dominates runtime and a better path is evidence-backed
    root_cause_statement: "The access path is inconsistent with the predicate selectivity, causing unnecessary row reads."
    recommendation: "Review index design and predicate alignment before changing schema or query shape."
    validation: "Test a plan change in a controlled environment and compare runtime and row counts."
    safety_risk: moderate
    related_rules: [AP-001, AP-003, PRED-001, IDX-001]
    reinforcing_rules: [CARD-005, PRED-004]
    contradictory_rules: [PART-001]
    dependency_relationships: ["may be caused by predicate coercion or missing index structure"]
    evidence_availability_behavior: "If index metadata is missing, this route cannot be evaluated with confidence."
    oracle_version_notes: "Oracle 19c behavior is consistent with documented access-path costing."
    licensing_notes: "Base data only."
    source_reference: "Oracle SQL Tuning Guide; DBMS_XPLAN documentation; optimizer access-path guidance."

  - id: AP-003
    name: Index exists but is bypassed
    domain: AP
    classification: [root-cause-candidate, symptom]
    problem_description: A legitimate index exists but the optimizer does not use it under a predicate pattern that should favor it.
    why_it_matters: This may reflect poor predicate alignment, stale statistics, or a genuinely incorrect access decision.
    required_evidence:
      - existing index definitions
      - predicate columns
      - execution plan
      - optimizer estimates
    oracle_sources:
      - {source: DBA_INDEXES, license: base}
      - {source: V$SQL_PLAN, license: base}
      - {source: DBA_TAB_STATISTICS, license: base}
    detection_conditions:
      - intended predicate matches index columns
      - plan uses a less selective path
      - cost estimates are inconsistent with expected index usage
    counter_evidence:
      - index is not valid for the workload
      - object size or access pattern makes the alternate path correct
    false_positive_risks:
      - index may be chosen only under certain bind values
    confidence_logic:
      - medium when the index is valid and unused repeatedly
      - high when multiple executions show repeated index bypass
    root_cause_statement: "The optimizer is ignoring a valid and relevant index due to plan-shaping conditions or poor statistical fit."
    recommendation: "Review predicate alignment, statistics, and bind behavior before changing the index."
    validation: "Compare index usage across comparable bind sets and validate runtime improvement after a controlled change."
    safety_risk: moderate
    related_rules: [AP-002, AP-004, CARD-001, CUR-001]
    reinforcing_rules: [PRED-004, PRED-003, CARD-005]
    contradictory_rules: [IDX-002]
    dependency_relationships: ["can be caused by implicit conversion, bind mismatch, or stale stats"]
    evidence_availability_behavior: "If the index metadata is unavailable, the diagnosis should be downgraded to an observation."
    oracle_version_notes: "Applies to Oracle 19c and later optimizer behavior with similar access-path principles."
    licensing_notes: "Base data only."
    source_reference: "Oracle SQL Tuning Guide; execution plan interpretation guidance; database reference for index metadata."

  - id: AP-004
    name: Function on indexed column blocks access path
    domain: AP
    classification: [root-cause-candidate]
    problem_description: A function or expression is applied to an indexed column, preventing the optimizer from using the index efficiently.
    why_it_matters: This is a common cause of unhelpful index bypass and sharp runtime inflation.
    required_evidence:
      - SQL predicate text
      - index key columns
      - plan filter steps
    oracle_sources:
      - {source: V$SQL_PLAN, license: base}
      - {source: DBA_INDEXES, license: base}
      - {source: DBA_IND_COLUMNS, license: base}
    detection_conditions:
      - predicate includes function, truncation, case conversion, or expression on the indexed column
      - plan shows scan instead of index access
    counter_evidence:
      - function is applied to a constant, not to the column search key
      - a tiny object makes the scan perfectly reasonable
    false_positive_risks:
      - some functions are necessary and may still be efficient on a small table
    confidence_logic:
      - medium when the expression clearly hits the indexed column
      - high when the plan repeatedly shows scan and the object is not small
    root_cause_statement: "The predicate expression defeats the index and forces a broader read pattern."
    recommendation: "Consider a function-based index, a rewritten predicate, or a safer access-path change only after validating the business logic."
    validation: "Test alternative predicate form and compare actual rows and elapsed time."
    safety_risk: moderate
    related_rules: [PRED-003, AP-005, PRED-004]
    reinforcing_rules: [AP-003, PRED-003]
    contradictory_rules: []
    dependency_relationships: ["often overlaps with implicit conversion and predicate sargability issues"]
    evidence_availability_behavior: "If the SQL text is unavailable, this rule cannot be evaluated."
    oracle_version_notes: "The issue is common across Oracle releases because the optimizer cannot easily use the index when the column is transformed."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; predicate and access-path analysis guidance."

  - id: AP-005
    name: Implicit conversion blocks index access
    domain: AP
    classification: [root-cause-candidate]
    problem_description: Oracle converts a bind or literal value to a different datatype before comparing it to a column, breaking index matching.
    why_it_matters: The optimizer may be unable to use a useful index because of type mismatch at the predicate level.
    required_evidence:
      - bind datatype or literal type
      - column datatype
      - predicate structure
      - plan access method
    oracle_sources:
      - {source: V$SQL, license: base}
      - {source: DBA_TAB_COL_STATISTICS, license: base}
      - {source: V$SQL_PLAN, license: base}
    detection_conditions:
      - column and predicate use different or coercible datatype representations
      - access path is inconsistent with equivalent typed predicate behavior
    counter_evidence:
      - the conversion is harmless because the object is small or there is already a broader scan path
    false_positive_risks:
      - the optimizer may still choose a sensible scan for a broad logic pattern
    confidence_logic:
      - medium when the coercion is evident and the access path is poor
      - high when the issue is repeated across multiple child cursors or execution plans
    root_cause_statement: "The predicate uses a coercion that defeats the index matching and forces a broader access path."
    recommendation: "Match the predicate datatype to the column datatype, validate bind handling, and compare plan quality before deployment."
    validation: "Test the same SQL with a typed bind or literal and compare the plan and runtime."
    safety_risk: moderate
    related_rules: [PRED-004, AP-003, PRED-005]
    reinforcing_rules: [CUR-001, PRED-005]
    contradictory_rules: []
    dependency_relationships: ["often appears with bind mismatch and plan instability"]
    evidence_availability_behavior: "If bind metadata is unavailable, the rule should be documented as unverified."
    oracle_version_notes: "Type coercion behavior is consistent across Oracle 19c and later; the root issue is optimizer mismatch rather than a proprietary change."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; optimizer documentation on datatype conversion and predicate evaluation."

  - id: CARD-001
    name: Stale or missing statistics
    domain: CARD
    classification: [root-cause-candidate]
    problem_description: Optimizer statistics are stale or absent, causing poor row estimates and a mismatched plan choice.
    why_it_matters: Cardinality errors often drive many downstream performance problems.
    required_evidence:
      - table statistics timestamp
      - table row counts
      - estimate vs actual rows
      - execution plan
    oracle_sources:
      - {source: DBA_TAB_STATISTICS, license: base}
      - {source: DBA_TABLES, license: base}
      - {source: V$SQL_PLAN_STATISTICS_ALL, license: base}
    detection_conditions:
      - object has substantial DML or data skew since the last stats refresh
      - estimated rows and actual rows differ materially
      - plan defects align with stale-estimate symptoms
    counter_evidence:
      - stats are fresh and still show good estimates
      - problem is environmental rather than optimizer estimate driven
    false_positive_risks:
      - a plan can still be bad even with fresh stats if the data shape is inherently difficult
    confidence_logic:
      - medium when the evidence clearly shows stale or absent statistics
      - high when the estimate error lines up with a known bad plan and repeated runtime pattern
    root_cause_statement: "The optimizer is using an inaccurate row estimate because the statistics are no longer representative of the table data."
    recommendation: "Review and refresh statistics appropriately; validate against the workload before relying on a plan change."
    validation: "Compare estimate-vs-actual row counts before and after stats refresh and confirm workload behavior."
    safety_risk: low
    related_rules: [CARD-005, CUR-004, JOIN-005]
    reinforcing_rules: [CARD-002, CARD-003]
    contradictory_rules: [EXT-001]
    dependency_relationships: ["can directly trigger join order issues and plan instability"]
    evidence_availability_behavior: "If statistics timestamps are unavailable, the rule should be downgraded to insufficient evidence."
    oracle_version_notes: "Oracle 19c still depends strongly on representative statistics; newer optimizer features may help but do not eliminate the need for reasonable stats."
    licensing_notes: "Base dictionary data only."
    source_reference: "Oracle SQL Tuning Guide; Oracle optimizer documentation on statistics and cost estimation."

  - id: CARD-002
    name: Missing histogram for skewed predicate
    domain: CARD
    classification: [root-cause-candidate]
    problem_description: A skewed column has no useful histogram, so the optimizer cannot estimate predicate selectivity correctly.
    why_it_matters: Missing histograms can distort row estimates for a small number of values that dominate the workload.
    required_evidence:
      - histogram metadata
      - column data distribution
      - predicate values
      - execution plan
    oracle_sources:
      - {source: DBA_HISTOGRAMS, license: base}
      - {source: DBA_TAB_COL_STATISTICS, license: base}
      - {source: V$SQL_PLAN, license: base}
    detection_conditions:
      - the predicate is on a skewed value domain
      - histogram is absent or low-quality
      - plan estimates are poor
    counter_evidence:
      - the column is nearly uniform
      - the workload is broad enough that a histogram is not essential
    false_positive_risks:
      - some workloads do not need a histogram for a stable plan
    confidence_logic:
      - medium when skew is obvious and the optimizer estimates are poor
      - high when the workload repeatedly uses the same skewed value pattern
    root_cause_statement: "The optimizer lacks a representative histogram for a skewed predicate, so it is estimating cardinality poorly."
    recommendation: "Consider a histogram or extended statistics if the column is skewed and the plan depends on a narrow value range."
    validation: "Compare estimate-vs-actual rows before and after the histogram change in a controlled test."
    safety_risk: low
    related_rules: [CARD-003, CARD-005, DATA-004]
    reinforcing_rules: [CARD-001, CUR-001]
    contradictory_rules: [CARD-004]
    dependency_relationships: ["often interacts with bind peeking and skewed workload values"]
    evidence_availability_behavior: "If histogram metadata is absent but the workload is not skewed, the rule remains low confidence."
    oracle_version_notes: "Histogram behavior is a standard Oracle 19c optimizer concept and remains relevant in newer Oracle versions."
    licensing_notes: "Base metadata only."
    source_reference: "Oracle SQL Tuning Guide; Oracle optimizer documentation on histograms and data skew."

  - id: CARD-003
    name: Skew not reflected in estimate
    domain: CARD
    classification: [symptom, root-cause-candidate]
    problem_description: Data skew exists but the optimizer estimate does not reflect it, causing a plan mismatch.
    why_it_matters: A small subset of values may dominate the cost, but the optimizer judges the workload as uniform.
    required_evidence:
      - column stats
      - histogram info
      - actual and estimated rows
      - query pattern
    oracle_sources:
      - {source: DBA_TAB_COL_STATISTICS, license: base}
      - {source: DBA_HISTOGRAMS, license: base}
      - {source: V$SQL_PLAN_STATISTICS_ALL, license: base}
    detection_conditions:
      - skew is obvious from data values
      - estimate is materially different from actual rows for skewed values
    counter_evidence:
      - system is not showing heavy concentration in any value set
    false_positive_risks:
      - some skew is acceptable if the workload is stable and the plan remains cheap
    confidence_logic:
      - medium when skew is visible in the data and is reflected in poor plans
      - high when repeated executions show the same pattern at high cost
    root_cause_statement: "The data distribution is skewed but the optimizer estimate is not using that reality, leading to a poor plan."
    recommendation: "Review histograms, extended stats, and distribution assumptions for the affected columns."
    validation: "Check estimate-versus-actual rows for skewed values before and after the relevant stats change."
    safety_risk: low
    related_rules: [CARD-002, DATA-004, CUR-001]
    reinforcing_rules: [CARD-001]
    contradictory_rules: []
    dependency_relationships: ["often appears with bind peeking and skewed column values"]
    evidence_availability_behavior: "If distribution evidence is absent, keep the rule low confidence."
    oracle_version_notes: "The concept applies across Oracle 19c and later."
    licensing_notes: "Base data only."
    source_reference: "Oracle optimizer documentation on skew, histograms, and cardinality estimation."

  - id: CARD-004
    name: Correlated predicate estimate drift
    domain: CARD
    classification: [root-cause-candidate]
    problem_description: Two or more predicates are correlated but the optimizer treats them as independent, creating a poor estimate.
    why_it_matters: Correlated predicates can drastically change cardinality and therefore drive join order or index choice.
    required_evidence:
      - predicate shape
      - column statistics
      - actual vs estimated rows
      - SQL plan
    oracle_sources:
      - {source: V$SQL, license: base}
      - {source: DBA_TAB_COL_STATISTICS, license: base}
      - {source: V$SQL_PLAN_STATISTICS_ALL, license: base}
    detection_conditions:
      - multiple filters exist on related columns
      - estimate is poor while actual rows differ materially
    counter_evidence:
      - the predicates are independent or have weak correlation
    false_positive_risks:
      - some SQL can tolerate estimate error without major cost impact
    confidence_logic:
      - medium when the correlation is clear and estimate error is serious
      - high when repeated executions show the same scenario and plan regression
    root_cause_statement: "The optimizer is treating correlated predicates as independent, which leads to inaccurate row estimates and poor access strategy."
    recommendation: "Review extended statistics or a safer join/filter structure when the query depends on correlated values."
    validation: "Compare estimated rows before and after applying extended statistics or rewrite changes."
    safety_risk: low
    related_rules: [CARD-003, JOIN-005, SUBQ-003]
    reinforcing_rules: [CARD-005]
    contradictory_rules: []
    dependency_relationships: ["often shows up with join-order problems or poor partition pruning"]
    evidence_availability_behavior: "If column statistics are insufficient, do not overstate this rule."
    oracle_version_notes: "Relevant for Oracle 19c and newer; extended statistics are a standard response."
    licensing_notes: "Base metadata only."
    source_reference: "Oracle optimizer documentation on extended statistics and column correlation."

  - id: CARD-005
    name: Large estimate-to-actual mismatch
    domain: CARD
    classification: [symptom, root-cause-candidate]
    problem_description: The optimizer estimate is materially different from the actual row count seen during execution.
    why_it_matters: It often leads to poor join order, poor access path choices, and unanticipated work.
    required_evidence:
      - estimated rows
      - actual rows
      - execution statistics
      - plan details
    oracle_sources:
      - {source: V$SQL_PLAN_STATISTICS_ALL, license: base}
      - {source: V$SQL, license: base}
      - {source: DBMS_XPLAN, license: base}
    detection_conditions:
      - difference between estimated and actual rows is large and consistent over repeated executions
    counter_evidence:
      - actual rows are not materially different and plan remains efficient
    false_positive_risks:
      - some estimates are intentionally rough but still acceptable
    confidence_logic:
      - medium when the mismatch is clear but not repeated
      - high when the mismatch aligns with repeated poor performance and a bad plan choice
    root_cause_statement: "The optimizer's row estimate is materially wrong, which has distorted the plan choice."
    recommendation: "Review statistics, histograms, and plan choices before making a schema or query change."
    validation: "Compare estimate-versus-actual rows across fresh executions after the stat or rewrite change."
    safety_risk: low
    related_rules: [CARD-001, CARD-002, JOIN-005, CUR-001]
    reinforcing_rules: [CARD-003, CARD-004]
    contradictory_rules: [EXT-001]
    dependency_relationships: ["often drives downstream symptoms like sort spill, poor join order, or bad access path"]
    evidence_availability_behavior: "If actual rows are unavailable, do not claim a significant mismatch."
    oracle_version_notes: "This is a standard optimizer problem area in Oracle 19c and later."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; Oracle optimizer documentation; DBMS_XPLAN behavior."

  - id: JOIN-001
    name: Nested loops on large driving set
    domain: JOIN
    classification: [symptom, root-cause-candidate]
    problem_description: Nested loops are being used on a driving set large enough to make repeated lookups excessively expensive.
    why_it_matters: This may cause a large number of repeated indexed probes or a slow row-by-row pattern.
    required_evidence:
      - join method
      - row counts at join steps
      - execution plan
      - runtime metrics
    oracle_sources:
      - {source: V$SQL_PLAN, license: base}
      - {source: V$SQL_PLAN_STATISTICS_ALL, license: base}
      - {source: V$SQL, license: base}
    detection_conditions:
      - join method is nested loops
      - outer row count or intermediate row set is large
      - runtime is dominated by repeated lookups or high logical I/O
    counter_evidence:
      - the driving set is small and runtime is not dominated by the join
    false_positive_risks:
      - nested loops are often appropriate when the driving set is small or the index is selective
    confidence_logic:
      - medium when row counts show a larger-than-expected driving set
      - high when the pattern is repeated and the elapsed time is dominated by join work
    root_cause_statement: "The chosen join strategy is good for a small driving set but poor for the actual row volume seen in this SQL."
    recommendation: "Re-evaluate join order, index selectivity, and whether a hash or merge strategy would better match the actual data volume."
    validation: "Compare alternative plans on the same data and track actual runtime and row counts."
    safety_risk: moderate
    related_rules: [JOIN-005, CARD-005, AP-003]
    reinforcing_rules: [AP-003, CARD-005]
    contradictory_rules: [JOIN-002]
    dependency_relationships: ["often caused by poor cardinality estimates or bad index usage"]
    evidence_availability_behavior: "If the plan is unavailable, this rule cannot be evaluated."
    oracle_version_notes: "Standard Oracle 19c join-choice behavior; later versions may further optimize join costing but concept remains valid."
    licensing_notes: "Base plan and runtime views only."
    source_reference: "Oracle SQL Tuning Guide; join method and cardinality discussion; Oracle optimizer documentation."

  - id: JOIN-002
    name: Hash join spill
    domain: JOIN
    classification: [symptom]
    problem_description: A hash join is spilling to disk or consuming a large share of memory, creating a costly join path.
    why_it_matters: A hash join can be efficient at first, but spilling changes it into a much slower physical I/O pattern.
    required_evidence:
      - hash join steps
      - temp usage
      - memory settings
      - runtime metrics
    oracle_sources:
      - {source: V$SQL_PLAN, license: base}
      - {source: V$SQL, license: base}
      - {source: V$TEMPSEG_USAGE, license: base}
    detection_conditions:
      - hash join is present
      - temp usage or memory pressure is high
      - runtime is dominated by the join data movement
    counter_evidence:
      - the data volume is small and the join is stable
    false_positive_risks:
      - a hash join may be perfectly appropriate on large but manageable datasets
    confidence_logic:
      - medium when memory or temp evidence is consistent with spill
      - high when actual runtime spikes coincide with join spill and large workarea use
    root_cause_statement: "The join strategy is not a poor choice in principle, but the current data volume or memory profile is causing spill and reducing efficiency."
    recommendation: "Review join cardinality, memory settings, and whether a different join order or dataset partitioning is more suitable."
    validation: "Measure temp usage and runtime before and after a join-order or memory-related change."
    safety_risk: moderate
    related_rules: [JOIN-005, SORT-001, PAR-004]
    reinforcing_rules: [CARD-005, SORT-001]
    contradictory_rules: [JOIN-001]
    dependency_relationships: ["often results from poor row estimates or a large intermediate result set"]
    evidence_availability_behavior: "Without temp or workarea evidence, classify as low-confidence observation."
    oracle_version_notes: "Workarea and hash-join behavior is standard in Oracle 19c and later."
    licensing_notes: "Base plan and runtime data with temp metrics."
    source_reference: "Oracle SQL Tuning Guide; workarea and hash join documentation."

  - id: JOIN-003
    name: Merge join causes unnecessary sort movement
    domain: JOIN
    classification: [symptom]
    problem_description: A merge join forces large sort or data movement that could be avoided or reduced.
    why_it_matters: Merge joins are not inherently bad, but they may create expensive sorting costs when order or join cardinality does not fit.
    required_evidence:
      - merge join in plan
      - sort steps
      - row counts
      - runtime effect
    oracle_sources:
      - {source: V$SQL_PLAN, license: base}
      - {source: V$SQL_PLAN_STATISTICS_ALL, license: base}
      - {source: V$SQL, license: base}
    detection_conditions:
      - merge join step present
      - sort work is large or repeated
      - runtime or temp behavior shows inefficiency
    counter_evidence:
      - sort is small and the merge join is the correct choice for ordered data
    false_positive_risks:
      - some merge joins are optimal with ordered data and a small sort footprint
    confidence_logic:
      - medium when sort cost is large and unnecessary
      - high only when repeated execution and strong evidence show the merge strategy is a burden
    root_cause_statement: "The merge join is introducing avoidable sort work that is larger than the functional requirement of the join."
    recommendation: "Review whether join order, index ordering, or a different join strategy reduces sort work."
    validation: "Compare alternative plans and measure sort cost and elapsed time."
    safety_risk: low
    related_rules: [JOIN-005, SORT-001, SORT-004]
    reinforcing_rules: [SORT-001]
    contradictory_rules: []
    dependency_relationships: ["can be worsened by poor ordering or insufficient index alignment"]
    evidence_availability_behavior: "If sort and plan evidence are absent, do not rate this strongly."
    oracle_version_notes: "Oracle 19c join behavior remains consistent with standard join-costing guidance."
    licensing_notes: "Base plan and runtime evidence only."
    source_reference: "Oracle SQL Tuning Guide; optimizer join strategy documentation."

  - id: JOIN-004
    name: Cartesian join
    domain: JOIN
    classification: [root-cause-candidate]
    problem_description: Oracle is joining row sources without a meaningful predicate, creating a combinatorial explosion of rows.
    why_it_matters: This is one of the clearest and most severe join defects seen in SQL tuning.
    required_evidence:
      - join predicates
      - plan rows
      - row-source counts
      - runtime metrics
    oracle_sources:
      - {source: V$SQL_PLAN, license: base}
      - {source: V$SQL_PLAN_STATISTICS_ALL, license: base}
      - {source: V$SQL, license: base}
    detection_conditions:
      - no join predicate or a broken predicate pattern appears in the plan
      - row counts at join step are extremely large
    counter_evidence:
      - the join is intentionally cross-product by business requirement, but that is rare and should be explicitly justified
    false_positive_risks:
      - some queries truly need cross-product semantics, but that is usually explicit and not accidental
    confidence_logic:
      - high when plan clearly shows a cartesian join and row count explosion occurs
    root_cause_statement: "The SQL is joining row sources without a valid join predicate, creating a cartesian product."
    recommendation: "Add or correct join predicates and validate business logic before accepting the result."
    validation: "Check row-source counts and confirm a corrected join predicate eliminates the explosion."
    safety_risk: high
    related_rules: [JOIN-005, AP-006, PRED-002]
    reinforcing_rules: [CARD-005]
    contradictory_rules: []
    dependency_relationships: ["often follows from a missing predicate or an OR merge issue"]
    evidence_availability_behavior: "If the plan hides the join predicate, the rule should be marked as not evaluated."
    oracle_version_notes: "This behavior has been a clear Oracle SQL defect across versions."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; optimizer join predicate documentation."

  - id: JOIN-005
    name: Poor join order
    domain: JOIN
    classification: [root-cause-candidate]
    problem_description: Oracle chooses an inefficient join sequence that causes large intermediate results and higher runtime.
    why_it_matters: Join order determines which row set is reduced first, which is a major cost determinant.
    required_evidence:
      - plan row-source order
      - join cardinality
      - estimated vs actual rows
      - runtime metrics
    oracle_sources:
      - {source: V$SQL_PLAN, license: base}
      - {source: V$SQL_PLAN_STATISTICS_ALL, license: base}
      - {source: V$SQL, license: base}
    detection_conditions:
      - join order appears to process large row sets before small filtering groups
      - estimated row set and actual behavior show poor cost propagation
    counter_evidence:
      - order is intentional and supported by data shape or statistics
    false_positive_risks:
      - a poor order can still be acceptable on small data sets
    confidence_logic:
      - medium when row counts and runtime suggest an inefficient order
      - high when the pattern is repeated across a larger workload
    root_cause_statement: "The join order is applying a large row set too early, causing excessive intermediate work and poor cost behavior."
    recommendation: "Review join order, filter placement, and whether a better driving table or index alignment is available."
    validation: "Compare the candidate join order to an alternate plan using the same data and confirm runtime reduction."
    safety_risk: moderate
    related_rules: [JOIN-001, CARD-005, PART-003]
    reinforcing_rules: [CARD-001, CARD-005]
    contradictory_rules: [JOIN-003]
    dependency_relationships: ["often comes from cardinality error or index mismatch"]
    evidence_availability_behavior: "If the plan is incomplete, the diagnosis should remain low confidence."
    oracle_version_notes: "Strongly relevant to Oracle 19c optimizer behavior."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; optimizer join order guidance."

  - id: SORT-001
    name: Sort spill to TEMP
    domain: SORT
    classification: [symptom]
    problem_description: Sort work exceeds memory and spills to temporary storage, increasing cost and latency.
    why_it_matters: Temporary spill can turn a fast in-memory sort into a slow physical I/O process.
    required_evidence:
      - sort steps in plan
      - temp usage
      - runtime metrics
      - row counts
    oracle_sources:
      - {source: V$SQL_PLAN, license: base}
      - {source: V$SQL, license: base}
      - {source: V$TEMPSEG_USAGE, license: base}
    detection_conditions:
      - sort operation present
      - memory or temp usage rises significantly
      - runtime is unexpectedly high
    counter_evidence:
      - the data set is small and in-memory sort remains cheap
    false_positive_risks:
      - not every sort spill is a defect, but repeated spill in a hot path is significant
    confidence_logic:
      - medium when spill occurs consistently
      - high when the spilled sort is a major part of runtime and ties to a recurring plan
    root_cause_statement: "The sort path is too large for the available workarea, so Oracle must spill to temporary storage."
    recommendation: "Review the SQL shape, row volume, and whether grouping or ordering choices are creating unnecessary sort work."
    validation: "Measure temp usage and elapsed time before and after a rewrite or plan change."
    safety_risk: moderate
    related_rules: [SORT-003, SORT-004, JOIN-002]
    reinforcing_rules: [JOIN-002, PAR-004]
    contradictory_rules: []
    dependency_relationships: ["often follows from bad join order or large intermediate sets"]
    evidence_availability_behavior: "Without temp or workarea evidence, keep as low confidence."
    oracle_version_notes: "Workarea spill is a standard Oracle 19c behavior and is heavily relevant to runtime tuning."
    licensing_notes: "Base plan and runtime data with temp usage if available."
    source_reference: "Oracle SQL Tuning Guide; workarea and sorting documentation."

  - id: SORT-002
    name: Hash aggregation spill
    domain: SORT
    classification: [symptom]
    problem_description: Hash aggregation exceeds memory and spills to disk, making compute cost much larger than expected.
    why_it_matters: Large aggregation spill is common when the plan is doing too much grouping or the data distribution is uneven.
    required_evidence:
      - hash aggregate steps
      - memory usage
      - temp usage
      - row counts
    oracle_sources:
      - {source: V$SQL_PLAN, license: base}
      - {source: V$SQL, license: base}
      - {source: V$TEMPSEG_USAGE, license: base}
    detection_conditions:
      - hash aggregate is present
      - memory or temp use is high
      - row volume makes the aggregate costly
    counter_evidence:
      - aggregate is over a modest data set and remains efficient
    false_positive_risks:
      - not every aggregation needs a memory fix
    confidence_logic:
      - medium when spill is repeated and block-size behavior suggests bad workarea fit
      - high when it dominates runtime and is consistent across repeated execution
    root_cause_statement: "The aggregation is too large for the current workarea settings, which causes spill and slower execution."
    recommendation: "Review the aggregation shape, grouping pattern, and whether the query can be rewritten or better partitioned."
    validation: "Check the before/after workarea and runtime behavior after a rewrite or plan change."
    safety_risk: moderate
    related_rules: [SORT-001, SORT-003, PAR-004]
    reinforcing_rules: [CARD-005, DATA-004]
    contradictory_rules: []
    dependency_relationships: ["often results from cardinality mismatch or large intermediate row sets"]
    evidence_availability_behavior: "If workarea evidence is unavailable, keep as an observation rather than a firm diagnosis."
    oracle_version_notes: "Hash aggregation spill is standard and well documented in Oracle 19c tuning materials."
    licensing_notes: "Base evidence with temp usage if present."
    source_reference: "Oracle SQL Tuning Guide; workarea and hash aggregate documentation."

  - id: SORT-003
    name: DISTINCT or GROUP BY overworks data
    domain: SORT
    classification: [symptom]
    problem_description: GROUP BY or DISTINCT is forcing unnecessary sort and duplicate elimination over a large row set.
    why_it_matters: This can be expensive even when the SQL is logically correct.
    required_evidence:
      - distinct or group-by steps
      - row counts
      - sort or aggregation metrics
    oracle_sources:
      - {source: V$SQL_PLAN, license: base}
      - {source: V$SQL, license: base}
      - {source: V$SQL_PLAN_STATISTICS_ALL, license: base}
    detection_conditions:
      - group-by or distinct is present
      - large intermediate rows are being reduced
      - runtime or sort evidence shows disproportionate work
    counter_evidence:
      - deduplication is required by business logic and the data volume is small
    false_positive_risks:
      - duplicates may be required, so the work is legitimate
    confidence_logic:
      - medium when a large row set is reduced with expensive sort behavior
      - high when the query is repeated and the work is clearly regular and unnecessary
    root_cause_statement: "The statement is doing more data reduction work than necessary because the grouping or duplicate-elimination pattern is larger than required."
    recommendation: "Review whether a different query shape, pre-aggregation, or set operation could reduce work without altering business meaning."
    validation: "Compare runtime and sort cost before and after the SQL rewrite or plan fix."
    safety_risk: low
    related_rules: [SORT-001, SORT-004, SUBQ-004]
    reinforcing_rules: [JOIN-005, CARD-005]
    contradictory_rules: []
    dependency_relationships: ["often follows from poor join order or from large upstream row sets"]
    evidence_availability_behavior: "If the group by and rows evidence are missing, do not rate this strongly."
    oracle_version_notes: "This remains standard across Oracle 19c."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; aggregation and sort behavior."

  - id: SORT-004
    name: ORDER BY or window step dominates runtime
    domain: SORT
    classification: [symptom]
    problem_description: A sort or windowing step is dominating total elapsed time because the statement must fully order or partition a large data set.
    why_it_matters: Ordering work can be very expensive when used on large sets or repeated patterns.
    required_evidence:
      - order-by or window steps
      - row counts
      - elapsed time contribution
    oracle_sources:
      - {source: V$SQL_PLAN, license: base}
      - {source: V$SQL_PLAN_STATISTICS_ALL, license: base}
      - {source: V$SQL, license: base}
    detection_conditions:
      - ordering or window operation is present
      - large row counts or long runtime are attributed to that step
    counter_evidence:
      - row set is small and the ordering cost is normal
    false_positive_risks:
      - ordering can be required by business logic, so not every sort is a defect
    confidence_logic:
      - medium when the sort step is clearly dominating cost
      - high when the same ordering pattern is repeated and the volume is large
    root_cause_statement: "The query is paying a large cost for ordering or window processing that may be larger than the business need."
    recommendation: "Review whether the ordering is needed for every row and whether a more constrained query path or better index order can help."
    validation: "Measure the runtime contribution of the order step before and after the rewrite or index change."
    safety_risk: low
    related_rules: [SORT-001, SORT-003, DATA-001]
    reinforcing_rules: [DATA-001]
    contradictory_rules: []
    dependency_relationships: ["may be the result of a large join before ordering"]
    evidence_availability_behavior: "If plan steps are missing, keep as low confidence."
    oracle_version_notes: "This remains a common pattern in 19c SQL tuning and is well documented."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; sort and analytic windowing documentation."

  - id: SUBQ-001
    name: Correlated subquery repeated per row
    domain: SUBQ
    classification: [root-cause-candidate]
    problem_description: A correlated subquery is executed repeatedly for each outer row, which can drive large runtime.
    why_it_matters: Repeated subquery execution amplifies logical work and often makes a query appear slower than it should.
    required_evidence:
      - plan step for correlated subquery
      - row counts
      - SQL text
      - runtime metrics
    oracle_sources:
      - {source: V$SQL_PLAN, license: base}
      - {source: V$SQL, license: base}
      - {source: V$SQL_PLAN_STATISTICS_ALL, license: base}
    detection_conditions:
      - subquery is correlated with outer row values
      - same subquery repeats for many outer rows
      - runtime is dominated by this repeated execution pattern
    counter_evidence:
      - number of outer rows is small and the subquery is not expensive in practice
    false_positive_risks:
      - some correlated subqueries are acceptable for small, controlled row sets
    confidence_logic:
      - medium when repeated execution is evident in the plan
      - high when the query is repeated and runtime remains poor across executions
    root_cause_statement: "The correlated subquery is being re-executed for each row, creating unnecessary repeated work."
    recommendation: "Rewrite the logic using joins, EXISTS pattern checks, or a different data-shaping approach if the business logic permits it."
    validation: "Compare runtime and row counts across the original query and the rewrite."
    safety_risk: moderate
    related_rules: [SUBQ-002, SUBQ-003, JOIN-001]
    reinforcing_rules: [AP-003]
    contradictory_rules: []
    dependency_relationships: ["can amplify poor join order or bad access path"]
    evidence_availability_behavior: "If the SQL text or plan is incomplete, do not claim a repeated-subquery defect."
    oracle_version_notes: "Correlated subquery patterns are standard across Oracle 19c and later."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; subquery and execution-plan guidance."

  - id: SUBQ-002
    name: Scalar subquery repeated or poorly materialized
    domain: SUBQ
    classification: [root-cause-candidate]
    problem_description: A scalar subquery is being evaluated repeatedly or without a useful materialized path.
    why_it_matters: Scalar subqueries often become a hidden repetition point, especially in large row sets.
    required_evidence:
      - scalar subquery steps
      - row counts
      - execute frequency
    oracle_sources:
      - {source: V$SQL_PLAN, license: base}
      - {source: V$SQL, license: base}
      - {source: V$SQL_PLAN_STATISTICS_ALL, license: base}
    detection_conditions:
      - scalar subquery shown as repeated row-source step
      - large row counts or repeated execution pattern
    counter_evidence:
      - the subquery is small and served via a small, efficient row set
    false_positive_risks:
      - some scalar subqueries are correct and cheap when done for a small row set
    confidence_logic:
      - medium when repeated evaluation is obvious
      - high when execution frequency and row count justify a real performance issue
    root_cause_statement: "The scalar subquery is being re-evaluated repeatedly rather than being served by a better data shape."
    recommendation: "Review whether a join, set-based rewrite, or pre-aggregation would be more efficient."
    validation: "Compare a rewrite against the original query on the same data and measure runtime."
    safety_risk: moderate
    related_rules: [SUBQ-001, SUBQ-004, JOIN-005]
    reinforcing_rules: [CARD-005]
    contradictory_rules: []
    dependency_relationships: ["may appear where cardinality estimates are poor"]
    evidence_availability_behavior: "If the scalar subquery is hidden by plan simplification, do not overstate the diagnosis."
    oracle_version_notes: "This remains a standard issue in Oracle SQL tuning."
    licensing_notes: "Base plan and runtime evidence only."
    source_reference: "Oracle SQL Tuning Guide; subquery tuning guidance."

  - id: SUBQ-003
    name: IN or EXISTS transformation is poor
    domain: SUBQ
    classification: [root-cause-candidate]
    problem_description: The SQL uses an IN or EXISTS form that is producing a poor query transformation or a costly anti-join pattern.
    why_it_matters: A subquery form that looks simple can still create a very expensive predicate evaluation path.
    required_evidence:
      - SQL text
      - plan steps
      - row counts
      - runtime metrics
    oracle_sources:
      - {source: V$SQL, license: base}
      - {source: V$SQL_PLAN, license: base}
      - {source: V$SQL_PLAN_STATISTICS_ALL, license: base}
    detection_conditions:
      - IN or EXISTS form is present and leads to repeated or broad lookups
      - plan shape does not match the expected efficient path
    counter_evidence:
      - the alternative form is not materially different in actual runtime
    false_positive_risks:
      - query structure may rely on optimizer rewrite behavior that is still acceptable
    confidence_logic:
      - medium when a clearly worse transformation is visible
      - high when runtime and row counts support the issue across repeated executions
    root_cause_statement: "The chosen form of predicate check is producing a significantly poorer execution plan than a more direct rewrite would."
    recommendation: "Review the SQL rewrite choice and compare the query with a join or EXISTS alternative."
    validation: "Test equivalent alternatives and compare actual row counts, plan shape, and runtime."
    safety_risk: moderate
    related_rules: [SUBQ-001, SUBQ-004, JOIN-001]
    reinforcing_rules: [CARD-005]
    contradictory_rules: []
    dependency_relationships: ["can be amplified by bad cardinality estimates or weak index alignment"]
    evidence_availability_behavior: "If plan evidence is missing, the rule stays unproven."
    oracle_version_notes: "Oracle 19c optimizer rewrite behavior remains important here."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; subquery and rewrite discussions."

  - id: SUBQ-004
    name: CTE or inline materialization issue
    domain: SUBQ
    classification: [root-cause-candidate]
    problem_description: A CTE or inline view is materialized or reused in a way that creates avoidable work or poor row-set behavior.
    why_it_matters: A seemingly tidy SQL structure can still become expensive if it forces repeated materialization or large intermediate results.
    required_evidence:
      - SQL text
      - plan steps
      - row counts
      - runtime metrics
    oracle_sources:
      - {source: V$SQL, license: base}
      - {source: V$SQL_PLAN, license: base}
      - {source: V$SQL_PLAN_STATISTICS_ALL, license: base}
    detection_conditions:
      - CTE or inline view appears in the SQL and causes materialization or repeated intermediate work
      - runtime pattern is poor relative to the row volume
    counter_evidence:
      - small data set or low repetition means the materialization is acceptable
    false_positive_risks:
      - materialization can be the correct trade-off when the query is logically complex
    confidence_logic:
      - medium when the row volume is large and the plan clearly materializes expensive intermediate sets
      - high when the repeated pattern is consistent and the runtime is dominated by the materialization step
    root_cause_statement: "The query uses a materialized CTE or inline path that is producing an excessive intermediate row set."
    recommendation: "Review whether the CTE could be inlined, reused, or refactored in a more set-based way."
    validation: "Compare runtime and row counts before and after the rewrite."
    safety_risk: moderate
    related_rules: [SUBQ-003, SORT-003, JOIN-005]
    reinforcing_rules: [CARD-005]
    contradictory_rules: []
    dependency_relationships: ["often linked to join order or large intermediate sort work"]
    evidence_availability_behavior: "Without plan or SQL text, the diagnosis cannot be trusted."
    oracle_version_notes: "This is a standard SQL-shape concern in Oracle 19c."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; query rewrite and CTE behavior guidance."

  - id: CUR-001
    name: Bind peeking instability
    domain: CUR
    classification: [root-cause-candidate]
    problem_description: Oracle chooses different plans for different binds because bind peeking is optimizing against a particular value distribution.
    why_it_matters: A single SQL statement may appear stable on average but behave poorly for certain bind values.
    required_evidence:
      - child cursors
      - bind values
      - plan hash values
      - execution count
    oracle_sources:
      - {source: V$SQL, license: base}
      - {source: V$SQL_SHARED_CURSOR, license: base}
      - {source: V$SQL_PLAN, license: base}
    detection_conditions:
      - multiple child cursors are active
      - plans vary materially across bind values
      - runtime differs by bind set or SQL pattern
    counter_evidence:
      - only one plan is used with a stable runtime profile
    false_positive_risks:
      - some bind variation is normal and not necessarily problematic
    confidence_logic:
      - medium when multiple plans exist and data distribution is skewed
      - high when the runtime profile clearly reflects different plan choices
    root_cause_statement: "The optimizer is choosing different plans based on a particular bind set, leading to unstable performance."
    recommendation: "Review bind skew, histogram quality, and whether the plan should be stabilized or better tuned."
    validation: "Compare plan hash values and runtime for representative bind sets."
    safety_risk: moderate
    related_rules: [CUR-002, CARD-002, PRED-005]
    reinforcing_rules: [CARD-005, CARD-003]
    contradictory_rules: []
    dependency_relationships: ["often linked to histogram or skew problems"]
    evidence_availability_behavior: "If child cursor data is absent, do not treat the issue as proven."
    oracle_version_notes: "Oracle 19c includes known bind-peeking behavior and adaptive cursor sharing features."
    licensing_notes: "Base evidence is sufficient for many cases."
    source_reference: "Oracle SQL Tuning Guide; adaptive cursor sharing and bind peeking documentation."

  - id: CUR-002
    name: Adaptive cursor sharing issue
    domain: CUR
    classification: [root-cause-candidate]
    problem_description: Adaptive cursor sharing is forced into a poor pattern because the workload uses multiple bind value groups but the optimizer is still not finding a stable plan.
    why_it_matters: Poor adaptive behavior can create repeated plan churn and unstable execution costs.
    required_evidence:
      - child cursors
      - bind sets
      - plan hash values
      - execution counts
    oracle_sources:
      - {source: V$SQL, license: base}
      - {source: V$SQL_SHARED_CURSOR, license: base}
      - {source: V$SQL, license: base}
    detection_conditions:
      - multiple child cursors for a single SQL ID
      - plan churn is strongly linked to bind value set
    counter_evidence:
      - one plan is stable and efficient, so the child-cursor churn is not serious
    false_positive_risks:
      - some adaptive behavior is acceptable and not a defect by itself
    confidence_logic:
      - medium when repeated churn is clearly tied to a value range
      - high when runtime and plan instability are sustained over a significant workload
    root_cause_statement: "The system is repeatedly reoptimizing across bind values rather than reaching a stable and efficient plan."
    recommendation: "Review bind distribution, histograms, and whether a planned fix or a safer SQL shape is needed."
    validation: "Compare plan hash stability and runtime under representative bind groups before and after refactoring."
    safety_risk: moderate
    related_rules: [CUR-001, CUR-003, CARD-002]
    reinforcing_rules: [CARD-005]
    contradictory_rules: [CUR-005]
    dependency_relationships: ["often appears when data skew is strong or when a histogram is not helping"]
    evidence_availability_behavior: "If bind values or child cursor counts are missing, the claim should be downgraded."
    oracle_version_notes: "Relevant to Oracle 19c and later; standard optimizer feature around bind-aware adaptation."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; adaptive cursor sharing documentation."

  - id: CUR-003
    name: Child cursor churn
    domain: CUR
    classification: [symptom]
    problem_description: A single SQL statement keeps producing many child cursors, creating overhead and plan instability.
    why_it_matters: Churn often masks deeper issues in bind selection, plan drift, or data skew.
    required_evidence:
      - child cursor count
      - parse counts
      - SQL hash details
      - plan versions
    oracle_sources:
      - {source: V$SQL, license: base}
      - {source: V$SQL_SHARED_CURSOR, license: base}
      - {source: V$SQL_PLAN, license: base}
    detection_conditions:
      - large number of child cursors exists for the same SQL ID
      - parse overhead or repeated plan changes are visible
    counter_evidence:
      - few child cursors and stable plan use
    false_positive_risks:
      - some statement families naturally produce a few child cursors without harm
    confidence_logic:
      - medium when cursor churn is obvious and sustained
      - high when the churn correlates with poor runtime or repeated plan changes
    root_cause_statement: "The SQL is repeatedly creating new child cursors, creating instability and higher overhead."
    recommendation: "Review bind variability, statistics, and whether the SQL shape is forcing reoptimization."
    validation: "Track cursor count and runtime over time to verify the churn is not just transient."
    safety_risk: low
    related_rules: [CUR-001, CUR-002, CUR-004]
    reinforcing_rules: [CARD-002]
    contradictory_rules: []
    dependency_relationships: ["often follows from bind-peeking or skew patterns"]
    evidence_availability_behavior: "If child cursor and parse counts are missing, treat this as unverified."
    oracle_version_notes: "A standard Oracle 19c SQL behavior issue."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; cursor-sharing and optimizer behavior documentation."

  - id: CUR-004
    name: Plan regression after a change
    domain: CUR
    classification: [root-cause-candidate]
    problem_description: The SQL plan changed after a stats refresh, code deploy, or environment change and the runtime worsened.
    why_it_matters: Plan regression is a major source of SQL performance degradation but must be proven with evidence.
    required_evidence:
      - historical plans
      - stats timing
      - change window
      - runtime comparison
    oracle_sources:
      - {source: DBA_HIST_SQL_PLAN, license: optional}
      - {source: V$SQL_PLAN, license: base}
      - {source: DBA_HIST_SQLSTAT, license: optional}
    detection_conditions:
      - plan hash changed around time of regression
      - runtime worsened after change in stats or code
    counter_evidence:
      - no plan hash change or no runtime shift occurred
    false_positive_risks:
      - external workload changes can look like a plan regression even when they are not
    confidence_logic:
      - medium when a clear plan hash change aligns with a worsening time window
      - high when historical evidence and runtime comparison support the same conclusion
    root_cause_statement: "A recent plan change is associated with the speed regression, and the evidence supports that the plan itself is the cause."
    recommendation: "Review the stats change, code change, or SQL plan management controls before making a corrective plan or SQL change."
    validation: "Use a controlled comparison between the old and new plan under representative workload conditions."
    safety_risk: moderate
    related_rules: [CUR-005, CARD-001, CARD-005]
    reinforcing_rules: [CARD-001, CARD-005]
    contradictory_rules: [EXT-001]
    dependency_relationships: ["can be caused by stats change, skew, or broader workload drift"]
    evidence_availability_behavior: "Historical evidence is optional; without it the diagnosis should remain cautious."
    oracle_version_notes: "Relevant to Oracle 19c; plan drift and optimizer behavior remain important in later releases."
    licensing_notes: "AWR/ASH may be optional or licensed."
    source_reference: "Oracle SQL Tuning Guide; SQL Plan Management and plan-change analysis guidance."

