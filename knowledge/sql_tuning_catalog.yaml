    safety_risk: low
    related_rules: [CUR-004, CUR-001]
    reinforcing_rules: [CARD-001]
    contradictory_rules: []
    dependency_relationships: ["may interact with plan regression, bind-peeking behavior, and stale stats"]
    evidence_availability_behavior: "If baseline data is missing, mark as not evaluated."
    oracle_version_notes: "SQL Plan Management remains a relevant Oracle 19c feature."
    licensing_notes: "Plan management may require support features or relevant metadata."
    source_reference: "Oracle SQL Tuning Guide; SQL Plan Management documentation."

  - id: PAR-001
    name: CPU-bound SQL
    domain: PAR
    classification: [symptom, environmental-contributor]
    problem_description: The query is consuming a large amount of CPU time and is therefore responsible for a high user-visible runtime cost.
    why_it_matters: CPU can be a real SQL defect, but it may also indicate a broader workload issue or concurrency bottleneck.
    required_evidence:
      - CPU time
      - elapsed time
      - concurrent session data
      - plan shape
    oracle_sources:
      - {source: V$SQL, license: base}
      - {source: V$SESSION, license: base}
      - {source: V$ACTIVE_SESSION_HISTORY, license: optional}
    detection_conditions:
      - CPU time is a significant part of runtime
      - query is active under load or concurrency pressure
    counter_evidence:
      - runtime is dominated by waits and not CPU
    false_positive_risks:
      - CPU pressure may be caused by a broader system issue, not the SQL alone
    confidence_logic:
      - medium when CPU dominates runtime and plan evidence matches the cost
      - high when the runtime remains poor even under controlled conditions
    root_cause_statement: "The SQL is consuming excessive CPU relative to the work it performs, which is moving runtime upward."
    recommendation: "Review whether the plan is doing excessive work, whether a better index or plan is available, and whether the broader workload is also at fault."
    validation: "Compare CPU time before and after SQL or workload changes."
    safety_risk: moderate
    related_rules: [PAR-002, PAR-004, EXT-001]
    reinforcing_rules: [CARD-005, JOIN-001]
    contradictory_rules: [EXT-001]
    dependency_relationships: ["may be aggravated by concurrency, I/O wait, or hardware saturation"]
    evidence_availability_behavior: "Without CPU or session evidence, this should remain an observation."
    oracle_version_notes: "This is core Oracle performance diagnostics for 19c and later."
    licensing_notes: "Base evidence if available; ASH may be optional."
    source_reference: "Oracle Database Performance Tuning Guide; Oracle wait and session guides."

  - id: PAR-002
    name: I/O-bound SQL
    domain: PAR
    classification: [symptom]
    problem_description: The SQL is dominated by logical or physical I/O work and is therefore waiting on I/O rather than SQL logic alone.
    why_it_matters: A large read cost is often a real problem but may still be a symptom of missing index, bad plan, or external storage slowdown.
    required_evidence:
      - buffer gets
      - physical reads
      - I/O waits
      - plan shape
    oracle_sources:
      - {source: V$SQL, license: base}
      - {source: V$SESSION, license: base}
      - {source: V$ACTIVE_SESSION_HISTORY, license: optional}
    detection_conditions:
      - reads dominate runtime or lag patterns
      - plan and object metadata match the read-heavy pattern
    counter_evidence:
      - the SQL is very fast when the object is in memory or when storage is healthy
    false_positive_risks:
      - storage may be the root cause rather than the SQL itself
    confidence_logic:
      - medium when the plan and read counts clearly show a heavy I/O pattern
      - high only when external I/O issues and SQL issues are both considered and separated
    root_cause_statement: "The SQL is performing a high volume of reads, which makes the statement costly even if the underlying storage or concurrency is also contributing."
    recommendation: "Check whether a better access path, fewer reads, or a storage issue is the true driver before changing query design."
    validation: "Compare runtime and read counts under a controlled test and confirm whether the storage or SQL path is the main contributor."
    safety_risk: moderate
    related_rules: [PAR-001, EXT-003, AP-001]
    reinforcing_rules: [AP-001, AP-003]
    contradictory_rules: [EXT-003]
    dependency_relationships: ["storage delay can amplify an otherwise normal SQL path"]
    evidence_availability_behavior: "If only partial I/O metrics are available, preserve uncertainty."
    oracle_version_notes: "I/O and CPU analysis remain central in Oracle 19c and later."
    licensing_notes: "Base data plus optional ASH."
    source_reference: "Oracle Database Performance Tuning Guide; Oracle wait and tuning guide."

  - id: PAR-003
    name: Parallel execution skew or serial bottleneck
    domain: PAR
    classification: [symptom]
    problem_description: Parallel execution creates uneven work distribution or a serial bottleneck, leading to poor scalability.
    why_it_matters: A parallel plan can become slower than serial execution if the work is not balanced efficiently.
    required_evidence:
      - parallel steps
      - PX statistics
      - runtime skew
      - object data distribution
    oracle_sources:
      - {source: V$SQL_PLAN, license: base}
      - {source: V$PX_SESSION, license: base}
      - {source: V$SQL, license: base}
    detection_conditions:
      - parallel execution is present
      - one or more PX steps dominate or show skew
      - runtime scales poorly with parallelism
    counter_evidence:
      - parallelism scales as expected and no skew is present
    false_positive_risks:
      - some parallel SQL is intentionally large and should be slow
    confidence_logic:
      - medium when skew is obvious but the runtime is not clearly bad
      - high when runtime is poor and skew is sustained under load
    root_cause_statement: "The parallel plan is not scaling well because the work is unevenly distributed or serially constrained."
    recommendation: "Review partitioning, distribution, and parallel settings before altering the SQL or schema."
    validation: "Test different parallel settings or partitioning patterns under controlled execution."
    safety_risk: moderate
    related_rules: [PAR-001, PAR-004, PART-004]
    reinforcing_rules: [PART-001, PART-004]
    contradictory_rules: []
    dependency_relationships: ["often worsened by partition skew or storage bottlenecks"]
    evidence_availability_behavior: "If PX metrics are absent, keep the result uncertain."
    oracle_version_notes: "Parallel execution behavior is a major area in Oracle 19c and later."
    licensing_notes: "Base plan and PX states."
    source_reference: "Oracle SQL Tuning Guide; parallel execution documentation."

  - id: PAR-004
    name: Memory pressure and workarea spill
    domain: PAR
    classification: [symptom, environmental-contributor]
    problem_description: The database is under memory pressure, which leads to workarea spill and slower execution.
    why_it_matters: Memory pressure can make a previously acceptable SQL shape perform poorly without changing the SQL itself.
    required_evidence:
      - memory settings
      - temp usage
      - workarea spill indicators
      - runtime metrics
    oracle_sources:
      - {source: V$SQL, license: base}
      - {source: V$TEMPSEG_USAGE, license: base}
      - {source: V$SESSION, license: base}
    detection_conditions:
      - workarea memory usage is high
      - temp spill is observed
      - memory pressure is also visible in workload metrics
    counter_evidence:
      - memory is healthy and no spill is visible
    false_positive_risks:
      - temporary spill can be normal for a large but acceptable query
    confidence_logic:
      - medium when memory and spill appear abnormal
      - high when the same SQL is repeatedly spilling under sustained load
    root_cause_statement: "The statement is operating under constrained memory conditions, which is causing workarea spill and degraded execution."
    recommendation: "Review memory sizing and workload concurrency before changing the SQL design."
    validation: "Compare runtime and temp usage across a memory-change or concurrency test."
    safety_risk: moderate
    related_rules: [SORT-001, SORT-002, EXT-006]
    reinforcing_rules: [SORT-001, SORT-002]
    contradictory_rules: []
    dependency_relationships: ["can make a normal sort or hash operation appear defective"]
    evidence_availability_behavior: "If temp or memory metrics are unavailable, keep as low confidence."
    oracle_version_notes: "This is relevant across Oracle 19c and later."
    licensing_notes: "Base data only."
    source_reference: "Oracle SQL Tuning Guide; workarea and memory guidance."

  - id: PART-001
    name: Partition pruning failure
    domain: PART
    classification: [root-cause-candidate]
    problem_description: The SQL uses a partition key predicate but Oracle does not prune partitions as expected.
    why_it_matters: This can force Oracle to read many partitions instead of a narrow subset.
    required_evidence:
      - partition key predicate
      - partition metadata
      - execution plan
    oracle_sources:
      - {source: DBA_TAB_PARTITIONS, license: base}
      - {source: DBA_IND_PARTITIONS, license: base}
      - {source: V$SQL_PLAN, license: base}
    detection_conditions:
      - partition key predicate present
      - plan scans more partitions than expected
      - runtime remains large because the scan is broad
    counter_evidence:
      - broad scan is deliberate because all partitions are needed
    false_positive_risks:
      - not all partitioned objects require pruning for every query
    confidence_logic:
      - medium when selective pruning should be present and is not
      - high when the false broad scan is repeated and expensive
    root_cause_statement: "The predicate is not being used to prune partitions, causing a broad scan where a narrow path should be possible."
    recommendation: "Review the partition predicate alignment and whether the object design or SQL shape should be adjusted."
    validation: "Compare partition scan steps and runtime before and after a rewrite or predicate fix."
    safety_risk: moderate
    related_rules: [PART-003, PART-004, AP-007]
    reinforcing_rules: [AP-007, JOIN-005]
    contradictory_rules: []
    dependency_relationships: ["may coexist with poor join order or a bad predicate structure"]
    evidence_availability_behavior: "If partition metadata is absent, the diagnosis is weak."
    oracle_version_notes: "Partition pruning is a core Oracle 19c optimization and remains relevant in newer releases."
    licensing_notes: "Base metadata and plan data."
    source_reference: "Oracle SQL Tuning Guide; partitioning and pruning documentation."

  - id: PART-002
    name: Partition-local index mismatch
    domain: PART
    classification: [root-cause-candidate]
    problem_description: The index and partition design do not match the actual access pattern, creating redundant or ineffective scans.
    why_it_matters: Local and global index designs have different performance implications under partitioned workloads.
    required_evidence:
      - partitioned index metadata
      - object design
      - plan steps
      - runtime metrics
    oracle_sources:
      - {source: DBA_INDEXES, license: base}
      - {source: DBA_IND_PARTITIONS, license: base}
      - {source: V$SQL_PLAN, license: base}
    detection_conditions:
      - partitioned object and index do not match expected access pattern
      - plan shows broad or repeated access across partitions
    counter_evidence:
      - the current index alignment is efficient for the workload
    false_positive_risks:
      - some objects are intentionally scanned broadly even with partition-local indexes
    confidence_logic:
      - medium when design mismatch is obvious and the plan is poor
      - high when the same pattern repeats under comparable workloads
    root_cause_statement: "The partitioned object and index design do not align with the actual workload, so the optimizer is choosing an inefficient path."
    recommendation: "Review the partitioning strategy and the local/global index fit before changing a production object."
    validation: "Compare the runtime on equivalent partitions and confirm the design effect."
    safety_risk: moderate
    related_rules: [PART-001, PART-003, IDX-001]
    reinforcing_rules: [PART-001]
    contradictory_rules: []
    dependency_relationships: ["can trigger broad partition scans and poor join order"]
    evidence_availability_behavior: "If partition metadata is missing, keep the diagnosis low confidence."
    oracle_version_notes: "Partition design remains a core Oracle 19c area."
    licensing_notes: "Base metadata only."
    source_reference: "Oracle partitioning documentation; SQL Tuning Guide."

  - id: PART-003
    name: Partition-wise join missed
    domain: PART
    classification: [optimization-opportunity]
    problem_description: A partitioned join is not using a partition-wise strategy even though it could reduce the work materially.
    why_it_matters: This is a performance opportunity that may be significant when both sides are partitioned similarly.
    required_evidence:
      - partition metadata
      - join plan
      - object distribution
    oracle_sources:
      - {source: V$SQL_PLAN, license: base}
      - {source: DBA_TAB_PARTITIONS, license: base}
      - {source: DBA_INDEXES, license: base}
    detection_conditions:
      - both objects are partitioned on similar keys
      - join plan does not show a partition-wise path
    counter_evidence:
      - non-partitioned or distinct partitioning shapes mean no partition-wise strategy is suitable
    false_positive_risks:
      - some designs do not support efficient partition-wise joins
    confidence_logic:
      - medium when the design strongly suggests the strategy should be used
      - high when the data shape and runtime show large, repeated opportunity
    root_cause_statement: "The optimizer is not using the partitioned nature of the joined objects, causing more work than necessary."
    recommendation: "Review partitioning alignment and whether the join pattern and data layout support a partition-wise strategy."
    validation: "Compare a controlled execution with a partition-wise plan and measure the effect on runtime and row volume."
    safety_risk: low
    related_rules: [PART-001, JOIN-005, CARD-005]
    reinforcing_rules: [PART-001]
    contradictory_rules: []
    dependency_relationships: ["often linked to join order and partition pruning"]
    evidence_availability_behavior: "This route remains a low-confidence opportunity without partition metadata."
    oracle_version_notes: "Oracle 19c supports strong partition-wise optimization."
    licensing_notes: "Base metadata only."
    source_reference: "Oracle partitioning guide; SQL Tuning Guide."

  - id: PART-004
    name: Broad partition scan from weak predicate
    domain: PART
    classification: [symptom]
    problem_description: A broad partition scan is caused by a weak or poorly aligned predicate rather than an actual partitioning defect.
    why_it_matters: The issue may be in the SQL predicate, not in the partitioning itself.
    required_evidence:
      - predicate pattern
      - partition key usage
      - plan
    oracle_sources:
      - {source: V$SQL_PLAN, license: base}
      - {source: DBA_TAB_PARTITIONS, license: base}
      - {source: V$SQL, license: base}
    detection_conditions:
      - plan reads many partitions
      - predicate is weak or poorly aligned
    counter_evidence:
      - the business requirement intentionally reads most partitions
    false_positive_risks:
      - some workloads genuinely need to read a wide object
    confidence_logic:
      - medium when the predicate is clearly too broad
      - high only when the same pattern repeats and the business logic allows a narrower query
    root_cause_statement: "The SQL is using a broad predicate, which causes the optimizer to scan many partitions rather than a narrow subset."
    recommendation: "Review the filter expression and whether the query can be narrowed before changing partition design."
    validation: "Validate a tighter predicate under the same workload and compare runtime."
    safety_risk: low
    related_rules: [PART-001, PRED-002, PRED-004]
    reinforcing_rules: [PRED-002]
    contradictory_rules: []
    dependency_relationships: ["can be hidden behind a broad partitioned range or a bad predicate shape"]
    evidence_availability_behavior: "If the predicate and plan are incomplete, leave this unproven."
    oracle_version_notes: "This remains a standard Oracle 19c partition-performance issue."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle partitioning and SQL tuning guides."

  - id: IDX-001
    name: Bad leading column order
    domain: IDX
    classification: [root-cause-candidate]
    problem_description: The leading column of the composite index does not match the filtering or join pattern used by the query.
    why_it_matters: The index may still exist but still not be useful because the first column is wrong for the access pattern.
    required_evidence:
      - index column order
      - predicate columns
      - execution plan
    oracle_sources:
      - {source: DBA_INDEXES, license: base}
      - {source: DBA_IND_COLUMNS, license: base}
      - {source: V$SQL_PLAN, license: base}
    detection_conditions:
      - leading column mismatch is clear from the predicate pattern
      - the plan shows a weak or unusable path
    counter_evidence:
      - a different index is already fit for the workload and the current one is intentionally not used
    false_positive_risks:
      - not every index must match every predicate pattern
    confidence_logic:
      - medium when the mismatch is obvious and repeated
      - high when a better index design is strongly supported and the current runtime is large
    root_cause_statement: "The index structure does not align with the predicate sequence, so Oracle cannot efficiently use it for the workload."
    recommendation: "Review the leading column and the access pattern before changing the schema."
    validation: "Compare the current path with a candidate index design under the same workloads."
    safety_risk: moderate
    related_rules: [IDX-003, AP-006, PRED-002]
    reinforcing_rules: [AP-003, AP-006]
    contradictory_rules: [IDX-002]
    dependency_relationships: ["may be hidden behind a function or conversion issue"]
    evidence_availability_behavior: "If index metadata or predicate columns are unavailable, keep this as low confidence."
    oracle_version_notes: "This is a fundamental Oracle index-design concept applicable in 19c and later."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; index design recommendations."

  - id: IDX-002
    name: Redundant or weak index
    domain: IDX
    classification: [optimization-opportunity]
    problem_description: An index exists but contributes little value and adds write and maintenance cost.
    why_it_matters: Low-value indexes can be expensive to maintain without helping the workload.
    required_evidence:
      - index definition
      - usage pattern
      - DML or runtime cost
    oracle_sources:
      - {source: DBA_INDEXES, license: base}
      - {source: DBA_IND_STATISTICS, license: base}
      - {source: V$SQL, license: base}
    detection_conditions:
      - index is rarely used or not used for known workload patterns
      - maintenance cost or write overhead is disproportionate
    counter_evidence:
      - the index is needed for integrity, uniqueness, or critical access paths
    false_positive_risks:
      - indexes can be used during occasional but important operations
    confidence_logic:
      - medium when the index is clearly unused for the measured workload
      - high when its cost is clearly not justified by a real need
    root_cause_statement: "The index is not offering enough benefit to justify its cost and may be adding maintenance overhead without value."
    recommendation: "Confirm actual usage and business need before removing or redesigning the index."
    validation: "Review index usage and runtime after any index removal or redesign."
    safety_risk: moderate
    related_rules: [IDX-001, IDX-003, AP-003]
    reinforcing_rules: [AP-003]
    contradictory_rules: [IDX-001]
    dependency_relationships: ["can coexist with query patterns that still require some supporting access path"]
    evidence_availability_behavior: "Without usage data, this should be treated as a planning hypothesis only."
    oracle_version_notes: "This is a common Oracle 19c design review area."
    licensing_notes: "Base data only."
    source_reference: "Oracle SQL Tuning Guide; index maintenance and design guidance."

  - id: IDX-003
    name: Missing covering index
    domain: IDX
    classification: [optimization-opportunity]
    problem_description: A workload repeatedly accesses the same columns but the index structure is not covering enough of the required column set.
    why_it_matters: Missing covering indexes can force extra table reads even when the predicate is selective.
    required_evidence:
      - selected columns
      - access path
      - index key set
      - row counts
    oracle_sources:
      - {source: V$SQL_PLAN, license: base}
      - {source: DBA_INDEXES, license: base}
      - {source: DBA_IND_COLUMNS, license: base}
    detection_conditions:
      - the plan repeatedly reads table blocks for columns that are already part of an index candidate
      - the same projected columns are used often
    counter_evidence:
      - table is small or the data pattern does not require a covering path
    false_positive_risks:
      - covering index may be a large maintenance burden if the workload is not frequent enough
    confidence_logic:
      - medium when the projected column pattern is obvious
      - high when the same query shape is repeated at high cost
    root_cause_statement: "The query is repeatedly reading table blocks even though the selected columns could be satisfied more efficiently by an index."
    recommendation: "Review whether a covering candidate or a different index design could satisfy the query without extra table reads."
    validation: "Compare runtime and block reads before and after the candidate index is evaluated."
    safety_risk: moderate
    related_rules: [IDX-001, AP-003, SORT-003]
    reinforcing_rules: [AP-003]
    contradictory_rules: []
    dependency_relationships: ["often corresponds to a plan that reads too much data after selective index access"]
    evidence_availability_behavior: "If the selected columns and plan are missing, keep it as a possible opportunity only."
    oracle_version_notes: "This remains an important Oracle index-design topic."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; index design and access-path guidance."

  - id: IDX-004
    name: Unusable or poorly maintained index state
    domain: IDX
    classification: [root-cause-candidate]
    problem_description: An index exists but is unusable, stale in important ways, or bloated enough to harm performance.
    why_it_matters: Poor index health can create huge effort without a visible external issue.
    required_evidence:
      - index status
      - index statistics
      - maintenance history
      - plan behavior
    oracle_sources:
      - {source: DBA_INDEXES, license: base}
      - {source: DBA_IND_STATISTICS, license: base}
      - {source: V$SQL_PLAN, license: base}
    detection_conditions:
      - index is not usable or is clearly unhealthy under workload and cost metrics
    counter_evidence:
      - index is healthy and performs as expected
    false_positive_risks:
      - some object states may be acceptable for low-use segments
    confidence_logic:
      - medium when maintenance or health evidence is clear
      - high when the workload reflects the unhealthy plan path
    root_cause_statement: "The object health or index metadata indicates an unhealthy or under-maintained index, which is directly affecting the plan."
    recommendation: "Review index health and maintenance state before deciding on a schema change."
    validation: "Check storage and usage behavior before and after rebuild or repair."
    safety_risk: moderate
    related_rules: [IDX-001, IDX-002, AP-003]
    reinforcing_rules: [AP-003]
    contradictory_rules: []
    dependency_relationships: ["may be hidden behind a broader plan problem, but is still important"]
    evidence_availability_behavior: "If index metadata is missing, no strong conclusion should be made."
    oracle_version_notes: "This is a standard Oracle index-health area for 19c and later."
    licensing_notes: "Base data only."
    source_reference: "Oracle SQL Tuning Guide; index maintenance and health guidance."

  - id: PRED-001
    name: Leading wildcard LIKE prevents index use
    domain: PRED
    classification: [root-cause-candidate]
    problem_description: A leading wildcard in the predicate defeats the index for a left-anchored search pattern.
    why_it_matters: Relative row matching or text search patterns can require broad scanning if the leading character is not constrained.
    required_evidence:
      - predicate text
      - plan access path
      - index definition
    oracle_sources:
      - {source: V$SQL, license: base}
      - {source: V$SQL_PLAN, license: base}
      - {source: DBA_INDEXES, license: base}
    detection_conditions:
      - LIKE '%value%' or a similar leading-wildcard predicate appears
      - plan shows an intended full scan or broad access
    counter_evidence:
      - the object is small or the predicate range is broad by design
    false_positive_risks:
      - some queries purposely need a broad search under a small data set
    confidence_logic:
      - medium when the wildcard form is obvious and the plan is broad
      - high when runtime is consistently poor and the object is not small
    root_cause_statement: "The predicate pattern prevents a tree-based index match and forces the optimizer toward a wider read."
    recommendation: "Review the query logic or consider a different pattern or a more constrained search form where appropriate."
    validation: "Compare the old pattern with a safer search form on representative data."
    safety_risk: low
    related_rules: [PRED-003, AP-004, AP-005]
    reinforcing_rules: [AP-003]
    contradictory_rules: []
    dependency_relationships: ["often interacts with text-style predicates or full-table scans"]
    evidence_availability_behavior: "If SQL text is missing, do not evaluate this rule."
    oracle_version_notes: "This is consistent with Oracle 19c execution-plan and predicate guidance."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; predicate and sargability concepts."

  - id: PRED-002
    name: OR predicate suppresses efficient access
    domain: PRED
    classification: [root-cause-candidate]
    problem_description: An OR predicate causes a poor access path or multiple branch logic that is more expensive than a better data-shaping alternative.
    why_it_matters: OR conditions often frustrate both index usage and cost estimation.
    required_evidence:
      - OR clause
      - predicate columns
      - plan output
    oracle_sources:
      - {source: V$SQL, license: base}
      - {source: V$SQL_PLAN, license: base}
      - {source: DBA_INDEXES, license: base}
    detection_conditions:
      - OR condition exists across columns or ranges
      - plan is broad or non-selective despite the logic
    counter_evidence:
      - the OR condition is small and efficient on a tiny object
    false_positive_risks:
      - sometimes the business logic is correct and the plan is acceptable
    confidence_logic:
      - medium when OR logic is clearly broad and the plan reflects it
      - high when the pattern is repeated and runtime remains poor
    root_cause_statement: "The OR condition is forcing a less selective access path and reducing the optimizer's ability to find a better plan."
    recommendation: "Review whether the logic can be converted into UNION ALL or a more selective structure."
    validation: "Compare the original OR query against a rewritten equivalent using the same workload."
    safety_risk: moderate
    related_rules: [PRED-001, PRED-004, JOIN-004]
    reinforcing_rules: [AP-003]
    contradictory_rules: []
    dependency_relationships: ["may trigger broad scans or bad join plans"]
    evidence_availability_behavior: "If the actual predicate text is missing, do not evaluate strongly."
    oracle_version_notes: "Classic Oracle predicate-sargability issue."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; predicate rewriting and optimizer decisions."

  - id: PRED-003
    name: Function traps on indexed column
    domain: PRED
    classification: [root-cause-candidate]
    problem_description: A function or complex expression on the indexed column prevents efficient index usage.
    why_it_matters: The SQL is not necessarily wrong, but the function prevents Oracle from matching the predicate to the index.
    required_evidence:
      - predicate expression
      - index key column
      - plan output
    oracle_sources:
      - {source: V$SQL, license: base}
      - {source: V$SQL_PLAN, license: base}
      - {source: DBA_INDEXES, license: base}
    detection_conditions:
      - function call or transformation sits on an indexed column in the predicate
      - plan chooses a broad access method
    counter_evidence:
      - small table or broad scan is still sensible
    false_positive_risks:
      - not every function is a problem if the table is small and the scan is acceptable
    confidence_logic:
      - medium when the function is on the column and row counts are large
      - high when repeated runtime evidence supports the problem
    root_cause_statement: "The predicate expression defeats the optimizer's ability to use the relevant index."
    recommendation: "Check for function-based index options or a more index-friendly predicate rewrite."
    validation: "Compare the original function-based predicate to an alternative access pattern."
    safety_risk: moderate
    related_rules: [AP-004, PRED-004, AP-003]
    reinforcing_rules: [AP-004]
    contradictory_rules: []
    dependency_relationships: ["often overlaps with implicit conversion and the access-path issue"]
    evidence_availability_behavior: "If the actual predicate text is missing, mark as insufficient evidence."
    oracle_version_notes: "This remains a standard Oracle 19c predicate issue."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; predicate and index interaction guidance."

  - id: PRED-004
    name: Implicit datatype conversion in predicate
    domain: PRED
    classification: [root-cause-candidate]
    problem_description: The predicate compares different datatypes, forcing conversion to a non-index-friendly form.
    why_it_matters: This is a common reason why a valid-looking query performs as though the index is absent.
    required_evidence:
      - column datatypes
      - bind or literal datatypes
      - execution plan
    oracle_sources:
      - {source: V$SQL, license: base}
      - {source: DBA_TAB_COL_STATISTICS, license: base}
      - {source: V$SQL_PLAN, license: base}
    detection_conditions:
      - column and predicate types differ
      - plan shows a broader access operation than expected
    counter_evidence:
      - the predicate is narrow and the object is small
    false_positive_risks:
      - conversion may be harmless for a very small table or simple query
    confidence_logic:
      - medium when a clear type mismatch is visible and the plan is poor
      - high when repeated execution demonstrates the issue across representative values
    root_cause_statement: "The optimizer is coercing the predicate to a different datatype, so the index cannot be used efficiently."
    recommendation: "Align the data types of the bind or literal with the column datatype."
    validation: "Test the same query with typed binds or matching literals and compare the plan."
    safety_risk: moderate
    related_rules: [AP-005, PRED-005, AP-003]
    reinforcing_rules: [AP-005]
    contradictory_rules: []
    dependency_relationships: ["can be a direct cause of access-path mismatch"]
    evidence_availability_behavior: "If datatype metadata is unavailable, leave it unresolved instead of assuming a defect."
    oracle_version_notes: "Very relevant to Oracle 19c and later because optimizer matching still depends on consistent types."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; optimizer predicate evaluation documentation."

  - id: PRED-005
    name: Bind-type mismatch across executions
    domain: PRED
    classification: [root-cause-candidate]
    problem_description: Different bind values or bind types cause the SQL to behave inconsistently across executions.
    why_it_matters: This is one of the main drivers of plan instability and poor tuning quality.
    required_evidence:
      - bind values
      - child cursor plan values
      - execution history
    oracle_sources:
      - {source: V$SQL, license: base}
      - {source: V$SQL_SHARED_CURSOR, license: base}
      - {source: V$SQL_PLAN, license: base}
    detection_conditions:
      - plans change materially across bind sets
      - runtime is inconsistent across bound values
    counter_evidence:
      - one stable plan is used for all values and performance is acceptable
    false_positive_risks:
      - some plan differences are expected under real data skew
    confidence_logic:
      - medium when bind set variation is clear
      - high when the same SQL continues to show unstable performance and plan changes under real workloads
    root_cause_statement: "The bind behavior is creating different plan fits across executions, which yields unstable performance."
    recommendation: "Review bind value patterns, histogram quality, and whether a more stable SQL plan or better statistics are needed."
    validation: "Compare representative bind values across their plan hashes and runtime."
    safety_risk: moderate
    related_rules: [CUR-001, CUR-002, PRED-004]
    reinforcing_rules: [CUR-001]
    contradictory_rules: []
    dependency_relationships: ["often linked to adaptive cursor sharing and histogram mismatch"]
    evidence_availability_behavior: "If bind values are not captured, this remains unresolved."
    oracle_version_notes: "This remains a standard Oracle 19c tuning issue."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; bind peeking and adaptive cursor sharing documentation."

  - id: DATA-001
    name: Pagination pattern causes repeated expensive work
    domain: DATA
    classification: [symptom]
    problem_description: A pagination or offset pattern repeatedly redoes expensive work to retrieve a small window of rows.
    why_it_matters: The query may be logically valid but expensive because of repeated scanning or sorting.
    required_evidence:
      - query pattern
      - execution plan
      - row counts
      - runtime metrics
    oracle_sources:
      - {source: V$SQL, license: base}
      - {source: V$SQL_PLAN, license: base}
      - {source: V$SQL_PLAN_STATISTICS_ALL, license: base}
    detection_conditions:
      - offset or page retrieval pattern is present
      - repeated work or large sort is visible in the plan
    counter_evidence:
      - the working set is small and the offset pattern is cheap
    false_positive_risks:
      - some pagination is expected and not inherently wrong
    confidence_logic:
      - medium when pagination is clearly repeated and small-window queries remain costly
      - high when repeated queries show a large incremental cost
    root_cause_statement: "The pagination pattern is causing repeated work rather than a narrow and efficient row selection."
    recommendation: "Review whether a cursor key, filter, or more efficient page strategy is appropriate."
    validation: "Compare the page-query pattern under representative load and measure runtime."
    safety_risk: low
    related_rules: [DATA-002, SORT-004, SUBQ-004]
    reinforcing_rules: [SORT-004]
    contradictory_rules: []
    dependency_relationships: ["often shows up with large sort work or repeated execution patterns"]
    evidence_availability_behavior: "If the query text is incomplete, do not treat it as a firm issue."
    oracle_version_notes: "This remains a common SQL design pattern across Oracle 19c and later."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; query-shape tuning and row-limiting patterns."

  - id: DATA-002
    name: Top-N query repeated unnecessarily
    domain: DATA
    classification: [symptom]
    problem_description: A Top-N query is repeatedly executed and contributes a high amount of repeated work.
    why_it_matters: Repeating the same expensive top-N logic may consume time that a cache or better query design could avoid.
    required_evidence:
      - execution frequency
      - query pattern
      - runtime metrics
    oracle_sources:
      - {source: V$SQL, license: base}
      - {source: V$SQL_PLAN, license: base}
      - {source: V$SQL_PLAN_STATISTICS_ALL, license: base}
    detection_conditions:
      - same top-N pattern executed many times with similar runtime profile
    counter_evidence:
      - repeated execution is expected and not expensive
    false_positive_risks:
      - some top-N queries are genuinely required and legitimately repeated
    confidence_logic:
      - medium when repeated execution is obvious and the work is large
      - high when runtime remains poor under a hot path with stable data pattern
    root_cause_statement: "The repeated top-N query is creating avoidable workload cost because it repeats the same expensive logic."
    recommendation: "Review whether a better caching or a more selective query pattern is possible."
    validation: "Measure runtime and row count before and after the candidate improvement."
    safety_risk: low
    related_rules: [DATA-001, DATA-003, SUBQ-002]
    reinforcing_rules: [CARD-005]
    contradictory_rules: []
    dependency_relationships: ["can be linked to data skew or a poor sort path"]
    evidence_availability_behavior: "If execution counts are unavailable, leave as low confidence."
    oracle_version_notes: "Standard SQL-shape tuning issue in Oracle 19c."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; top-N and row-limiting discussions."

  - id: DATA-003
    name: Large result set returned unnecessarily
    domain: DATA
    classification: [symptom]
    problem_description: The query returns a large result set when a smaller set or a more constrained path would have sufficed.
    why_it_matters: Returning more data than needed can dominate memory and I/O cost.
    required_evidence:
      - rows processed
      - result size
      - query shape
    oracle_sources:
      - {source: V$SQL, license: base}
      - {source: V$SQL_PLAN_STATISTICS_ALL, license: base}
      - {source: V$SQL_PLAN, license: base}
    detection_conditions:
      - the query reads or returns a large set that is disproportionate to the final action
    counter_evidence:
      - the query intentionally returns a broad result set by business requirement
    false_positive_risks:
      - some large reports are legitimate and not defective
    confidence_logic:
      - medium when the result set seems broader than the business need
      - high only when runtime shows the broad return is dominating cost and a smaller result set is feasible
    root_cause_statement: "The SQL is returning more data than is necessary for the workload, expanding the cost of the operation."
    recommendation: "Review whether a narrower result set, aggregation, or narrower predicate is feasible."
    validation: "Measure runtime and row output before and after a tighter result-set design."
    safety_risk: low
    related_rules: [DATA-001, DATA-002, SORT-003]
    reinforcing_rules: [SORT-003]
    contradictory_rules: []
    dependency_relationships: ["often overlaps with poor join order or repeated query logic"]
    evidence_availability_behavior: "If result size is absent, do not claim this strongly."
    oracle_version_notes: "This is a common reporting and query-shape issue in Oracle 19c."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; result-set and query-shape tuning."

  - id: DATA-004
    name: Data skew biases the plan
    domain: DATA
    classification: [symptom, root-cause-candidate]
    problem_description: A subset of values dominates a column and is causing a plan to underperform under real workload conditions.
    why_it_matters: This is a common runtime problem in skewed data sets and can be mistaken for a bad optimizer plan.
    required_evidence:
      - histogram or distribution
      - value frequency
      - runtime metrics
    oracle_sources:
      - {source: DBA_HISTOGRAMS, license: base}
      - {source: DBA_TAB_COL_STATISTICS, license: base}
      - {source: V$SQL_PLAN_STATISTICS_ALL, license: base}
    detection_conditions:
      - a small set of values dominates the workload
      - the plan degrades for those values while remaining acceptable elsewhere
    counter_evidence:
      - data is not significantly skewed and the runtime is stable
    false_positive_risks:
      - some skew is routine and not harmful if the plan remains efficient
    confidence_logic:
      - medium when skew is visible and aligned with poor runtime
      - high when repeated executions show a strong value-specific cost issue
    root_cause_statement: "The SQL sees a strongly skewed workload, and the plan is not fitting the dominant value pattern well."
    recommendation: "Review histograms, extended statistics, and the skewed values before changing object design or SQL structure."
    validation: "Measure runtime under dominant and non-dominant values before and after the stats change."
    safety_risk: low
    related_rules: [CARD-002, CARD-003, CUR-001]
    reinforcing_rules: [CARD-003]
    contradictory_rules: []
    dependency_relationships: ["closely mirrors cardinality and bind-peeking issues"]
    evidence_availability_behavior: "If no distribution evidence exists, keep the diagnosis conservative."
    oracle_version_notes: "This is a standard Oracle 19c optimizer discussion area."
    licensing_notes: "Base evidence only."
    source_reference: "Oracle SQL Tuning Guide; histograms and skew documentation."

  - id: EXT-001
    name: Competing SQL creates contention
    domain: EXT
    classification: [environmental-contributor]
    problem_description: Other SQL is consuming the same CPU, I/O, or memory resources and making the SQL look worse than it is on its own.
    why_it_matters: The problem may be a shared-resource issue, not a SQL defect.
    required_evidence:
      - concurrent session evidence
      - CPU or I/O waits
      - ASH or session trap data if available
    oracle_sources:
      - {source: V$SESSION, license: base}
      - {source: V$SESSION_EVENT, license: base}
      - {source: V$ACTIVE_SESSION_HISTORY, license: optional}
    detection_conditions:
      - other sessions with similar resource use overlap in time
      - the target SQL is impacted by waits or contention patterns
    counter_evidence:
      - no competing workload exists and the SQL still remains costly on its own
    false_positive_risks:
      - any workload can contribute to contention, but it does not always explain the root cause
    confidence_logic:
      - medium when comparable concurrency is visible in the same time window
      - high when the target SQL and the competing workload are clearly correlated in timing and resource use
    root_cause_statement: "The SQL is suffering from broader workload contention rather than being uniquely defective in isolation."
    recommendation: "Review concurrency, workload windows, and resource-sharing patterns before changing the SQL design."
    validation: "Compare the same SQL in a quieter window and measure whether the delay falls away."
    safety_risk: moderate
    related_rules: [PAR-001, PAR-002, EXT-003]
    reinforcing_rules: [PAR-001]
    contradictory_rules: [PAR-001]
    dependency_relationships: ["can hide real plan defects or amplify them"]
    evidence_availability_behavior: "Without concurrency evidence, keep as unresolved rather than blaming SQL alone."
    oracle_version_notes: "Core Oracle performance analysis and workload diagnosis."
    licensing_notes: "Base data plus optional ASH."
    source_reference: "Oracle Database Performance Tuning Guide; wait and concurrency documentation."

  - id: EXT-002
    name: RMAN or backup load causes slow I/O
    domain: EXT
    classification: [environmental-contributor]
    problem_description: Backup or RMAN activity is creating high I/O contention and slowing the SQL path.
    why_it_matters: Database I/O may be dominated by backup work rather than SQL logic.
    required_evidence:
      - backup windows
      - I/O waits
      - runtime correlation
    oracle_sources:
      - {source: V$SESSION, license: base}
      - {source: V$SESSION_EVENT, license: base}
      - {source: V$ACTIVE_SESSION_HISTORY, license: optional}
    detection_conditions:
      - backup or RMAN sessions overlap the SQL's execution window
      - I/O or storage waits rise at the same time
    counter_evidence:
      - no overlap with backup windows or no I/O pattern exists
    false_positive_risks:
      - storage issues can mirror backup pressure but are not always the same cause
    confidence_logic:
      - medium when overlap is clear
      - high when runtime degradation aligns with backup activity and resource waits
    root_cause_statement: "Backup activity is increasing storage pressure and delaying the SQL path."
    recommendation: "Review backup windows and data protection schedules in parallel with SQL tuning."
    validation: "Compare runtime with and without the overlapping backup workload."
    safety_risk: low
    related_rules: [EXT-003, PAR-002, EXT-001]
    reinforcing_rules: [PAR-002]
    contradictory_rules: []
    dependency_relationships: ["often looks like an I/O-bound SQL issue but is caused by external backup work"]
    evidence_availability_behavior: "If backup timing is unavailable, the issue is not strong enough to claim a root cause."
    oracle_version_notes: "This is a standard Oracle operational issue in 19c and later."
    licensing_notes: "Base data plus optional ASH."
    source_reference: "Oracle RMAN documentation; Oracle Database Performance Tuning Guide."

  - id: EXT-003
    name: Storage or ASM latency dominates runtime
    domain: EXT
    classification: [environmental-contributor]
    problem_description: Storage or ASM latency is the main cause of the poor runtime, not the SQL plan itself.
    why_it_matters: Storage problems may make otherwise healthy SQL look broken.
    required_evidence:
      - physical reads
      - storage or ASM metrics
      - wait events
    oracle_sources:
      - {source: V$SESSION_EVENT, license: base}
      - {source: V$ACTIVE_SESSION_HISTORY, license: optional}
      - {source: V$SQL, license: base}
    detection_conditions:
      - runtime is dominated by storage-related waits or physical I/O
      - the SQL plan appears reasonable but storage responds poorly
    counter_evidence:
      - the SQL itself has a clear, repeated structural defect
    false_positive_risks:
      - storage issues can still hide the true SQL-level issue
    confidence_logic:
      - medium when storage waits are strong and the plan is otherwise reasonable
      - high when a broader storage investigation confirms the issue and the SQL is not obviously wrong
    root_cause_statement: "The SQL is not the primary problem; the storage layer is forcing poor runtime behavior."
    recommendation: "Review storage health, ASM performance, and physical path behavior before rewriting the SQL."
    validation: "Compare runtime under a healthy storage window with the degraded one."
    safety_risk: moderate
    related_rules: [EXT-002, PAR-002, EXT-001]
    reinforcing_rules: [PAR-002]
    contradictory_rules: [AP-001]
    dependency_relationships: ["can make a valid plan look bad if the storage path is slow or backed up"]
    evidence_availability_behavior: "Without storage or wait evidence, do not assert that storage is the true issue."
    oracle_version_notes: "This remains a standard Oracle operational perspective across Oracle versions."
    licensing_notes: "Optional storage telemetry and ASH may be required for stronger evidence."
    source_reference: "Oracle Database Performance Tuning Guide; storage and I/O tuning guidance."

  - id: EXT-004
    name: RAC interconnect or cache issue
    domain: EXT
    classification: [environmental-contributor]
    problem_description: RAC-level interconnect or cache behavior is affecting the SQL, even if the SQL shape is not obviously broken.
    why_it_matters: Shared cluster issues can be mistaken for SQL tuning problems.
    required_evidence:
      - RAC or interconnect metrics
      - wait events
      - node and instance context
    oracle_sources:
      - {source: V$SESSION, license: base}
      - {source: V$SESSION_EVENT, license: base}
      - {source: V$ACTIVE_SESSION_HISTORY, license: optional}
    detection_conditions:
      - waits or latency show a cluster-level effect
      - SQL behavior is broad across nodes or instances
    counter_evidence:
      - a single-node or single-instance SQL analysis shows a local SQL defect instead
    false_positive_risks:
      - a bad plan can still be present alongside RAC issues
    confidence_logic:
      - medium when interconnect or cache waits align with the performance problem
      - high when the issue is cluster-wide and documented as a RAC condition rather than a single query defect
    root_cause_statement: "The cluster layer is contributing a significant share of the runtime cost, so the SQL effect is not purely local."
    recommendation: "Review RAC health, interconnect, and instance behavior before altering SQL design."
    validation: "Compare node-local and cluster-wide behavior under the same workload conditions."
    safety_risk: moderate
    related_rules: [EXT-001, PAR-001, JOIN-005]
    reinforcing_rules: [PAR-001]
    contradictory_rules: []
    dependency_relationships: ["can make a normally good SQL plan look unstable under distributed workload conditions"]
    evidence_availability_behavior: "Without cluster telemetry, this should be left as external suspicion, not a proven cause."
    oracle_version_notes: "This is a core Oracle RAC and performance problem area."
    licensing_notes: "May require cluster-specific telemetry beyond base database views."
    source_reference: "Oracle RAC and Database Performance Tuning guidance; Oracle Database 19c RAC documentation."

  - id: EXT-005
    name: Blocking or lock chain is the main trigger
    domain: EXT
    classification: [environmental-contributor]
    problem_description: A blocking session or lock chain is the real reason the query is slow, not a SQL design issue.
    why_it_matters: The SQL may be waiting in a lock path rather than doing expensive work itself.
    required_evidence:
      - blocking sessions
      - wait events
      - session chain
    oracle_sources:
      - {source: V$SESSION, license: base}
      - {source: V$SESSION_EVENT, license: base}
      - {source: V$ACTIVE_SESSION_HISTORY, license: optional}
    detection_conditions:
      - SQL is waiting on locks or blocking chains
      - blocking transaction is a stronger explanation than the SQL plan itself
    counter_evidence:
      - the plan is also poor and contributes materially to runtime
    false_positive_risks:
      - blocking can coexist with a genuine SQL issue
    confidence_logic:
      - medium when session blocking is clearly the dominant delay
      - high when the wait chain and runtime profile line up strongly
    root_cause_statement: "The SQL is not the primary issue; its delay is driven by a blocking session or lock chain."
    recommendation: "Review blocking sessions, transaction scope, and concurrency paths before changing the SQL."
    validation: "Compare runtime with and without the blocking chain and confirm the delay pattern."
    safety_risk: high
    related_rules: [EXT-001, PAR-001, CUR-004]
    reinforcing_rules: [PAR-001]
    contradictory_rules: []
    dependency_relationships: ["can be triggered by application logic or inefficient transaction scope"]
    evidence_availability_behavior: "If blocking evidence is absent, do not claim a lock-driven cause."
    oracle_version_notes: "This is a standard Oracle locking and wait analysis area."
    licensing_notes: "Base evidence plus wait and session data."
    source_reference: "Oracle Database Performance Tuning Guide; lock and wait analysis documentation."

