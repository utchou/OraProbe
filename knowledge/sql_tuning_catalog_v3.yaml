      "name": "Full scan not justified by row set or predicate",
      "domain": "AP",
      "diagnostic_class": "optimization_opportunity",
      "hypothesis": "Full scan not justified by row set or predicate",
      "oracle_versions": [
        "19c"
      ],
      "scope": [
        "database",
        "container",
        "instance",
        "sql_or_family",
        "execution_or_window"
      ],
