        "source_entitled_and_available",
        "aligned_identity_and_window",
        "metric_quality_constraints",
        "configured_referenced_thresholds"
      ],
      "decision": {
        "all": [
          {
            "op": "gt",
            "left": {
              "metric": "full_scans"
            },
            "right": {
              "literal": 0
            }
          },
