        "file": "knowledge/sql_tuning_catalog.yaml",
        "rule_id": "AP-001",
        "preserve": "all explanation/evidence/false-positive content; corrected V3 decision and sources supersede legacy claims"
      },
      "observations": [
        "full_scans",
        "full_scan_options",
        "access_gain"
      ],
      "required_evidence": [
        "plan",
        "trials"
      ],
      "optional_evidence": [
        "changes",
        "coverage",
        "executions"
