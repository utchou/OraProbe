    "unknown_policy": "Absent requires an adequately collected negative search. Missing, null, unlicensed, reset or incomparable inputs yield UNKNOWN. FALSE dominates all; TRUE dominates any; not UNKNOWN is UNKNOWN. Missing required evidence prevents evaluation.",
    "window_policy": "Half-open UTC windows with original timezone retained; clock uncertainty and sampling intervals bound onset. Never prorate AWR SQL aggregates into arbitrary smaller windows.",
    "counter_policy": "Cumulative differences require matching database/container/instance/startup/cursor incarnation, monotonic counters and timestamp pair. Eviction or reload makes the interval unknown; record in-flight and fetch-completion bias.",
    "execution_policy": "Count QC executions once across RAC; sum worker CPU once. SQL_EXEC_ID is not unique alone. Group by database/container/QC instance/session serial/SQL_ID/execution start/id. Ambiguous association stays session/SQL level.",
    "plan_policy": "Match runtime and estimates to executed adaptive branch and child. E-Rows is per start; use A-Rows/Starts. Inclusive parent/child elapsed and buffers cannot be summed for exclusive cost.",
    "baseline_policy": "Match bind/selectivity, data volume, completion, hardware, plan context, service, group/caging, instance and concurrency strata. Record deviations and minimum sample/baseline magnitude. No baseline means unknown, not healthy.",
    "licensing_policy": "Resolve entitlement plus offering/feature plus configuration plus privilege plus retention independently for each source. Demo full licensing is already authorized. Source existence and CONTROL_MANAGEMENT_PACK_ACCESS do not establish entitlement.",
    "roles": [
      "trigger",
      "primary_contributor",
      "secondary_contributor",
      "amplifier",
      "victim",
      "bystander",
      "unresolved"
    ],
    "conclusions": [
      "observation",
      "derived_fact",
      "symptom",
      "optimization_opportunity",
      "candidate_contributor",
      "supported_cause",
      "unresolved_hypothesis",
      "no_material_degradation"
    ],
    "causal_gate": [
      "measured_degradation",
      "mechanism_link",
      "compatible_temporal_order",
      "counter_search_complete",
      "comparable_control"
    ],
    "role_policy": "Per workload/resource/window. Waiting is not consumption. Primary requires measured resource share above workload policy and compatible saturation mechanism. Secondary requires positive attributable demand and tested impact below primary policy. Bystander requires observed participation, normal matched costs and no tested mechanism link. Otherwise unresolved.",
    "demand_policy": "CPU cores demanded = CPU seconds / window seconds; equivalently CPU/execution * executions/second. TEMP occupancy is simultaneous sum, not sum of peaks. Execution frequency and concurrency are separate; never multiply measured rate by concurrency.",
    "scope_binding": "Each evaluation binds one database/container/window and declared entity grain. All conjuncts join on SQL/child/execution/operation identity where operation evidence is used; unrelated operations cannot satisfy a conjunction. Family aggregates use validated membership version. Scalar metric results are broadcast only after explicit aggregation to the target grain; multirow comparisons require stated all/any population quantifier.",
    "metric_input_policy": "Ratios use sum numerator / sum denominator at common grouping unless parameter explicitly selects max/mean/percentile. Cumulative SQL counters are normalized to interval deltas before per-execution or demand metrics; endpoints and completion coverage required. Baseline aggregates preserve exact same membership and strata. Literal structural boundaries >0 or >1 do not label abnormal cost.",
    "parameter_policy": "Recipe parameters describe deterministic collection/relational/aggregation contracts, never LLM judgments or executable strings. Named population selectors are defined by evidence fields, resolved AST/operator IDs or external provider schema. Unimplemented parser/resolver/selector capability yields unsupported/UNKNOWN. No implicit callback/eval is allowed."
  },
  "operators": {
    "select": "Filter a dataset with typed comparison tree; preserve entity/time keys.",
    "count": "Number of selected rows; full coverage required for absence.",
    "count_distinct": "Count distinct tuple values after null/identity exclusion.",
    "sum": "Sum selected numeric rows once within stated grain, never inclusive parent/child or QC duplicate.",
    "max": "Maximum observed value; sampled maxima are lower bounds on true peaks.",
    "delta": "End minus start for same counter incarnation; monotonic required.",
    "ratio": "Numerator/denominator after common grain aggregation; zero/null denominator UNKNOWN.",
    "rate": "Counter delta / actual covered seconds; no extrapolation outside coverage.",
    "baseline_ratio": "Incident statistic / matched baseline statistic with positive minimum magnitude and sample policy.",
    "normalized_row_error": "a = LAST_OUTPUT_ROWS/LAST_STARTS; e = CARDINALITY. If starts<=0 unknown; e=a=0 gives 1; exactly one zero gives tagged zero mismatch (not finite ratio); else max(a/e,e/a).",
    "ast_count": "Count exact parsed predicate/query AST patterns from deterministic parser. Unsupported syntax yields UNKNOWN, never regex semantic equivalence.",
    "set_difference_count": "Count needed resolved columns/partitions absent from supplied available set; preserve object identity.",
    "joint_selectivity_ratio": "Measured joint selectivity / product of measured marginal selectivities in supplied distribution sample; zero denominator UNKNOWN.",
    "overlap_count": "Maximum number of distinct QC execution intervals active at common timestamps; open intervals censored, sampled estimate marked.",
    "simultaneous_sum": "At each aligned timestamp sum distinct allocation keys, then maximum. Unknown gaps remain incomplete. Never add workarea and TEMPSEG_USAGE for same allocation.",
    "family_group": "Build candidate groups using nonzero signature or AST template; validate schema/object resolution and AST operators/bind positions. Keep selectivity strata. Plan/object/module similarities only support candidate paths, never merge alone. Predicate variants remain subfamilies unless explicit application equivalence records validate semantics.",
    "dependency_path_count": "Resolve text object references plus schema/synonyms, expand supplied dependency graph with cycle detection and depth bound; intersect with executed plan object IDs/aliases. Keep dynamic SQL/remote/missing paths unresolved.",
    "weighted_sample_share": "Sum actual sample duration for selected active states / duration for defined comparable active population. ON CPU is scheduled-or-runnable, not exact measured CPU. Do not sum repeated ASH TIME_WAITED.",
    "onset_lag": "Interval [child earliest-parent latest, child latest-parent earliest], expanded by clock errors/sampling. Positive lower bound supports order; straddling zero unknown.",
    "trial_ratio": "Matched reference trial cost / alternative trial cost, only result-equivalent, complete, repeated executions in same environment; record named cost field.",
    "coverage_ratio": "Covered seconds / requested seconds per instance/container/source; gaps explicitly unioned, not summed.",
    "percentile": "Specified quantile of complete comparable execution costs; specify interpolation, sample count; not derivable from aggregate V$SQL alone.",
    "flag_count": "Count exact source field values matching enumerated flags; absence only under complete collection."
  },
  "confidence_policy": {
    "id": "CP-01",
    "semantics": "Ranking weights, not calibrated probabilities",
    "base_support": 40,
    "independent_support_weight": 15,
    "max_independent_support_groups": 2,
    "counter_weight": -30,
    "controlled_disconfirmation_weight": -60,
    "range": [
      0,
      100
    ],
    "unknown_required": "not_evaluated",
    "unknown_counter_or_timeline_cap": 40,
    "indirect_family_cap": 40,
    "cause_gate_required": true,
    "double_count_policy": "Same raw evidence/mechanism contributes once across alias/overlap rules; coexisting causes do not exclude one another."
  },
