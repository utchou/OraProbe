            "op": "le",
            "left": {
              "metric": "wall_deviation"
            },
            "right": {
              "threshold": "material_deviation"
            }
          },
          "explanation": "Comparable wall latency within tolerance weakens claimed incident effect; does not refute a standing optimization opportunity."
        },
        {
          "id": "AP-001-disconfirm",
          "effect": "weaken_mechanism",
          "independence_group": "controlled_trial",
          "test": {
            "op": "le",
            "left": {
              "metric": "controlled_gain"
            },
            "right": {
              "threshold": "controlled_cost_gain"
            }
          },
          "explanation": "An equivalent mechanism-targeted trial failing to improve cost weakens that mechanism; absent/incomparable trial stays UNKNOWN."
        }
