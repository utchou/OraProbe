      "supporting_tests": [
        {
          "test": {
            "op": "gt",
            "left": {
              "metric": "wall_deviation"
            },
            "right": {
              "threshold": "material_deviation"
            }
          },
          "independence_group": "matched_cost",
          "effect": "support_incident_impact"
